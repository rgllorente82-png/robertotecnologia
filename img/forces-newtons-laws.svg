<svg viewBox="-110.4 -19.8 1361.8 739.7" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font-family: Arial, sans-serif; font-size: 16px; font-weight: bold; text-anchor: middle; }
      .label { font-family: Arial, sans-serif; font-size: 12px; text-anchor: middle; }
      .box { stroke: #2c3e50; stroke-width: 2; }
      .arrow { stroke: #e74c3c; stroke-width: 3; fill: none; marker-end: url(#arrowred); }
      .good { stroke: #27ae60; stroke-width: 3; fill: none; marker-end: url(#arrowgreen); }
    </style>
    <marker id="arrowred" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#e74c3c"/>
    </marker>
    <marker id="arrowgreen" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="-110" y="-20" width="1362" height="740" fill="#f8f9fa"/>

  <!-- Title -->
  <text x="500" y="35" class="title" font-size="18">Las Tres Leyes de Newton</text>
  <text x="500" y="55" class="label" font-size="11" fill="#666">El fundamento de toda la mecánica clásica</text>

  <!-- LAW 1 -->
  <g>
    <rect x="30" y="80" width="300" height="200" fill="#e8f4f8" stroke="#3498db" stroke-width="2" rx="5"/>
    <text x="180" y="110" class="title" font-size="13">1ª LEY (Inercia)</text>

    <!-- Visual: object at rest -->
    <circle cx="110" cy="150" r="20" fill="#d4a574" stroke="#8b6914" stroke-width="2"/>
    <text x="110" y="192" class="label" style="font-size: 11px" font-weight="bold">En reposo</text>

    <!-- Visual: object moving -->
    <circle cx="225" cy="150" r="20" fill="#d4a574" stroke="#8b6914" stroke-width="2"/>
    <text x="225" y="192" class="label" style="font-size: 11px" font-weight="bold">Movimiento</text>
    <path d="M248,150 L285,150" class="good"/>

    <g font-family="Arial" font-size="10" fill="#2c3e50" text-anchor="start">
      <text x="50" y="210"><tspan font-weight="bold">Si no hay fuerza:</tspan> Un objeto en reposo</text>
      <text x="50" y="225">permanece en reposo. Uno en movimiento</text>
      <text x="50" y="240">sigue con velocidad constante.</text>
    </g>
  </g>

  <!-- LAW 2 -->
  <g>
    <rect x="350" y="80" width="300" height="200" fill="#e8f4f8" stroke="#3498db" stroke-width="2" rx="5"/>
    <text x="500" y="110" class="title" font-size="13">2ª LEY (F = m·a)</text>

    <!-- Formula box -->
    <rect x="380" y="130" width="240" height="50" fill="white" stroke="#3498db" stroke-width="2" rx="3"/>
    <text x="500" y="155" class="title" font-size="12">F = m × a</text>

    <!-- Visual: before and after -->
    <circle cx="420" cy="205" r="15" fill="#d4a574" stroke="#8b6914" stroke-width="2"/>
    <text x="420" y="210" class="label" font-size="9">m</text>
    <path d="M435,205 L480,205" class="arrow"/>
    <text x="460" y="200" class="label" font-size="9">F</text>

    <circle cx="520" cy="205" r="15" fill="#d4a574" stroke="#8b6914" stroke-width="2"/>
    <path d="M535,205 L570,205" class="good" stroke-width="4"/>
    <text x="555" y="200" class="label" font-size="10" font-weight="bold">a</text>

    <g font-family="Arial" font-size="10" fill="#2c3e50" text-anchor="start">
      <text x="370" y="235"><tspan font-weight="bold">Más fuerza = más aceleración</tspan></text>
      <text x="370" y="250">Una fuerza produce aceleración.</text>
    </g>
  </g>

  <!-- LAW 3 -->
  <g>
    <rect x="670" y="80" width="300" height="200" fill="#e8f4f8" stroke="#3498db" stroke-width="2" rx="5"/>
    <text x="820" y="110" class="title" font-size="13">3ª LEY (Acción-Reacción)</text>

    <!-- Visual: two objects pushing each other -->
    <circle cx="760" cy="160" r="15" fill="#ff9999" stroke="#e74c3c" stroke-width="2"/>
    <path d="M775,160 L795,160" class="arrow"/>

    <circle cx="840" cy="160" r="15" fill="#99ccff" stroke="#3498db" stroke-width="2"/>
    <path d="M825,160 L805,160" stroke="#27ae60" stroke-width="3" fill="none"/>

    <text x="820" y="200" class="label" font-size="10" text-anchor="middle" font-weight="bold">Acción ↔ Reacción</text>

    <g font-family="Arial" font-size="10" fill="#2c3e50" text-anchor="start">
      <text x="700" y="235"><tspan font-weight="bold">Si A empuja a B:</tspan></text>
      <text x="700" y="250">B empuja a A con igual fuerza</text>
      <text x="700" y="265">pero en dirección contraria.</text>
    </g>
  </g>

  <!-- APPLICATIONS SECTION -->
  <g>
    <rect x="30" y="300" width="940" height="380" fill="#fffbea" stroke="#f39c12" stroke-width="2" rx="5"/>

    <text x="60" y="330" class="title" style="text-anchor: start; font-size: 14px">Aplicaciones prácticas de las tres leyes</text>

    <g font-family="Arial" font-size="11" fill="#2c3e50" text-anchor="start">
      <text x="60" y="358"><tspan font-weight="bold">1ª Ley (Inercia):</tspan> Por eso llevas cinturón de seguridad. El coche frena, pero tú sigues hacia adelante<tspan x="60" dy="15">por inercia. El cinturón es la fuerza que te detiene a ti.</tspan></text>

      <text x="60" y="398"><tspan font-weight="bold">2ª Ley (F = m·a):</tspan> Un motor pequeño no levanta una carga grande; uno potente sí. La aceleración que<tspan x="60" dy="15">consigues depende de cuánta fuerza tengas y de cuánto pese lo que mueves.</tspan></text>

      <text x="60" y="438"><tspan font-weight="bold">3ª Ley (Acción-Reacción):</tspan> Un cohete expulsa gas hacia abajo y el gas lo empuja hacia arriba.<tspan x="60" dy="15">Cada fuerza tiene su pareja, del mismo tamaño y en sentido contrario.</tspan></text>

      <text x="60" y="478"><tspan font-weight="bold">En máquinas simples:</tspan> Una palanca de 2.º género levanta 100 kg con 25 kg de fuerza: ganas 4 en<tspan x="60" dy="15">fuerza y pierdes 4 en distancia. La energía es la misma: F₁·d₁ = F₂·d₂.</tspan></text>

      <text x="60" y="518"><tspan font-weight="bold">Peso y masa:</tspan> Tu masa es siempre 70 kg. Tu peso es 70 × 9,81 = 686 N, que es la fuerza con que<tspan x="60" dy="15">la gravedad tira de ti. En otro planeta la masa no cambia; el peso, sí.</tspan></text>

      <text x="60" y="558"><tspan font-weight="bold">Sistema solar:</tspan> Los planetas giran alrededor del Sol porque la gravedad los mantiene en curva.<tspan x="60" dy="15">Sin esa fuerza saldrían disparados en línea recta, por la 1ª ley.</tspan></text>

      <text x="60" y="598"><tspan font-weight="bold">Clave:</tspan> Toda la tecnología —motores, puentes, edificios, aviones, robots— sigue estas tres<tspan x="60" dy="15">leyes. Si una máquina falla, es porque hay una fuerza que no se calculó bien.</tspan></text>
    </g>
  </g>

</svg>