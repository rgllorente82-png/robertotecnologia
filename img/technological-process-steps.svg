<svg viewBox="0 0 1000 700" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font-family: Arial, sans-serif; font-size: 16px; font-weight: bold; text-anchor: middle; }
      .label { font-family: Arial, sans-serif; font-size: 12px; }
      .step-label { font-family: Arial, sans-serif; font-size: 11px; text-anchor: middle; font-weight: 500; }
    </style>
    <marker id="arrowdark" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2c3e50"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1000" height="700" fill="#f8f9fa"/>

  <!-- Title -->
  <text x="500" y="35" class="title" font-size="18">El Proceso Tecnol&oacute;gico: 7 pasos</text>
  <text x="500" y="55" class="label" font-size="11" fill="#666" text-anchor="middle">Desde el problema hasta la evaluaci&oacute;n: c&oacute;mo se lleva a cabo un proyecto tecnol&oacute;gico</text>

  <!-- Seven main steps in a flow -->

  <!-- Step 1: Problem -->
  <g>
    <circle cx="80" cy="140" r="45" fill="#e74c3c" stroke="#c0392b" stroke-width="2"/>
    <text x="80" y="135" class="step-label" fill="#fff">1</text>
    <text x="80" y="165" class="label" font-size="10" text-anchor="middle" font-weight="bold">Definir</text>
    <text x="80" y="180" class="label" font-size="9" text-anchor="middle">el problema</text>
  </g>

  <!-- Arrow 1-2 -->
  <path d="M 125 140 L 170 140" stroke="#2c3e50" stroke-width="2.5" fill="none" marker-end="url(#arrowdark)"/>

  <!-- Step 2: Requirements -->
  <g>
    <circle cx="235" cy="140" r="45" fill="#f39c12" stroke="#d68910" stroke-width="2"/>
    <text x="235" y="135" class="step-label" fill="#fff">2</text>
    <text x="235" y="165" class="label" font-size="10" text-anchor="middle" font-weight="bold">Especificar</text>
    <text x="235" y="180" class="label" font-size="9" text-anchor="middle">requisitos</text>
  </g>

  <!-- Arrow 2-3 -->
  <path d="M 280 140 L 325 140" stroke="#2c3e50" stroke-width="2.5" fill="none" marker-end="url(#arrowdark)"/>

  <!-- Step 3: Design -->
  <g>
    <circle cx="390" cy="140" r="45" fill="#3498db" stroke="#1a73e8" stroke-width="2"/>
    <text x="390" y="135" class="step-label" fill="#fff">3</text>
    <text x="390" y="165" class="label" font-size="10" text-anchor="middle" font-weight="bold">Dise&ntilde;ar</text>
    <text x="390" y="180" class="label" font-size="9" text-anchor="middle">la soluci&oacute;n</text>
  </g>

  <!-- Arrow 3-4 -->
  <path d="M 435 140 L 480 140" stroke="#2c3e50" stroke-width="2.5" fill="none" marker-end="url(#arrowdark)"/>

  <!-- Step 4: Prototype -->
  <g>
    <circle cx="545" cy="140" r="45" fill="#9b59b6" stroke="#7d3c98" stroke-width="2"/>
    <text x="545" y="135" class="step-label" fill="#fff">4</text>
    <text x="545" y="165" class="label" font-size="10" text-anchor="middle" font-weight="bold">Construir</text>
    <text x="545" y="180" class="label" font-size="9" text-anchor="middle">el prototipo</text>
  </g>

  <!-- Arrow 4-5 -->
  <path d="M 590 140 L 635 140" stroke="#2c3e50" stroke-width="2.5" fill="none" marker-end="url(#arrowdark)"/>

  <!-- Step 5: Test -->
  <g>
    <circle cx="700" cy="140" r="45" fill="#27ae60" stroke="#229954" stroke-width="2"/>
    <text x="700" y="135" class="step-label" fill="#fff">5</text>
    <text x="700" y="165" class="label" font-size="10" text-anchor="middle" font-weight="bold">Probar</text>
    <text x="700" y="180" class="label" font-size="9" text-anchor="middle">y validar</text>
  </g>

  <!-- Arrow 5-6 -->
  <path d="M 745 140 L 790 140" stroke="#2c3e50" stroke-width="2.5" fill="none" marker-end="url(#arrowdark)"/>

  <!-- Step 6: Improve -->
  <g>
    <circle cx="855" cy="140" r="45" fill="#16a085" stroke="#117a65" stroke-width="2"/>
    <text x="855" y="135" class="step-label" fill="#fff">6</text>
    <text x="855" y="165" class="label" font-size="10" text-anchor="middle" font-weight="bold">Mejorar</text>
    <text x="855" y="180" class="label" font-size="9" text-anchor="middle">el dise&ntilde;o</text>
  </g>

  <!-- Arrow 6-7 (downward) -->
  <path d="M 855 185 L 855 240" stroke="#2c3e50" stroke-width="2.5" fill="none" marker-end="url(#arrowdark)"/>

  <!-- Step 7: Document -->
  <g>
    <circle cx="855" cy="305" r="45" fill="#2980b9" stroke="#1a5276" stroke-width="2"/>
    <text x="855" y="300" class="step-label" fill="#fff">7</text>
    <text x="855" y="330" class="label" font-size="10" text-anchor="middle" font-weight="bold">Documentar</text>
    <text x="855" y="345" class="label" font-size="9" text-anchor="middle">y comunicar</text>
  </g>

  <!-- Feedback loop from 6 to 5 -->
  <path d="M 810 140 Q 755 110 745 140" stroke="#e74c3c" stroke-width="2" fill="none" marker-end="url(#arrowdark)" stroke-dasharray="5,3"/>
  <text x="750" y="110" class="label" font-size="9" fill="#e74c3c">retroalimentaci&oacute;n</text>

  <!-- BOTTOM: Details -->
  <g>
    <rect x="30" y="410" width="940" height="270" fill="white" stroke="#2c3e50" stroke-width="1.5" rx="3"/>

    <text x="500" y="440" class="title" font-size="13">Qu&eacute; se hace en cada paso</text>

    <g font-family="Arial" font-size="10.5" fill="#2c3e50" text-anchor="start">
      <text x="60" y="470"><b>1. Definir el problema</b></text>
      <text x="80" y="488">¿Qu&eacute; necesito construir? ¿Para quién? ¿Por qu&eacute; no existe ya?</text>

      <text x="60" y="510"><b>2. Especificar requisitos</b></text>
      <text x="80" y="528">Lo que DEBE cumplir: tamaño, peso, materiales, resistencia, presupuesto. Requisitos comprobables.</text>

      <text x="60" y="550"><b>3. Dise&ntilde;ar la soluci&oacute;n</b></text>
      <text x="80" y="568">Croquis acotados, despieces, matriz de decisi&oacute;n de materiales, hoja de proceso, Gantt.</text>

      <text x="60" y="590"><b>4. Construir el prototipo</b></text>
      <text x="80" y="608">Ejecutar el plan: medir, cortar, ensamblar, probar componentes individuales.</text>

      <text x="60" y="630"><b>5. Probar y validar</b></text>
      <text x="80" y="648">¿Cumple los requisitos? ¿Funciona bajo condiciones normales y extremas?</text>

      <text x="500" y="470"><b>6. Mejorar el dise&ntilde;o</b></text>
      <text x="520" y="488">Si algo falla: vuelves al paso anterior, arreglas y pruebas de nuevo.</text>

      <text x="500" y="510"><b>7. Documentar y comunicar</b></text>
      <text x="520" y="528">Memor&iacute;a del proyecto: c&oacute;mo lo hiciste, qu&eacute; aprend&iacute;ste, c&oacute;mo se usa.</text>

      <text x="500" y="560" class="label" font-size="11" fill="#e74c3c" font-weight="bold">Esto no es lineal:</text>
      <text x="520" y="580">La retroalimentaci&oacute;n de la prueba (5) vuelve a mejorar (6), no siempre a dise&ntilde;ar.</text>
      <text x="520" y="598">Muchos ciclos cortos: dise&ntilde;a poco, construye poco, prueba, mejora, repite.</text>
      <text x="520" y="616">Es lo que hace un ingeniero: itera hasta que funciona.</text>
    </g>
  </g>

</svg>