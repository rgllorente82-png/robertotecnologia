<svg viewBox="0 0 1000 700" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font-family: Arial, sans-serif; font-size: 16px; font-weight: bold; text-anchor: middle; }
      .label { font-family: Arial, sans-serif; font-size: 12px; }
      .step-label { font-family: Arial, sans-serif; font-size: 11px; text-anchor: middle; font-weight: 500; }
    </style>
    <marker id="arrowdark" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2c3e50"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1000" height="700" fill="#f8f9fa"/>

  <!-- Title -->
  <text x="500" y="35" class="title" font-size="18">El Proceso Tecnológico: 7 pasos</text>
  <text x="500" y="55" class="label" font-size="11" fill="#666" text-anchor="middle">Desde el problema hasta la evaluación: cómo se lleva a cabo un proyecto tecnológico</text>

  <!-- Seven main steps in a flow -->

  <!-- Step 1: Problem -->
  <g>
    <circle cx="80" cy="140" r="45" fill="#e74c3c" stroke="#c0392b" stroke-width="2"/>
    <text x="80" y="135" class="step-label" fill="#fff">1</text>
    <text x="80" y="205" class="label" font-size="10" text-anchor="middle" font-weight="bold">Detectar</text>
    <text x="80" y="220" class="label" font-size="9" text-anchor="middle">la necesidad</text>
  </g>

  <!-- Arrow 1-2 -->
  <path d="M 125 140 L 170 140" stroke="#2c3e50" stroke-width="2.5" fill="none" marker-end="url(#arrowdark)"/>

  <!-- Step 2: Requirements -->
  <g>
    <circle cx="235" cy="140" r="45" fill="#f39c12" stroke="#d68910" stroke-width="2"/>
    <text x="235" y="135" class="step-label" fill="#fff">2</text>
    <text x="235" y="205" class="label" font-size="10" text-anchor="middle" font-weight="bold">Analizar</text>
    <text x="235" y="220" class="label" font-size="9" text-anchor="middle">el problema</text>
  </g>

  <!-- Arrow 2-3 -->
  <path d="M 280 140 L 325 140" stroke="#2c3e50" stroke-width="2.5" fill="none" marker-end="url(#arrowdark)"/>

  <!-- Step 3: Design -->
  <g>
    <circle cx="390" cy="140" r="45" fill="#3498db" stroke="#1a73e8" stroke-width="2"/>
    <text x="390" y="135" class="step-label" fill="#fff">3</text>
    <text x="390" y="205" class="label" font-size="10" text-anchor="middle" font-weight="bold">Buscar</text>
    <text x="390" y="220" class="label" font-size="9" text-anchor="middle">ideas</text>
  </g>

  <!-- Arrow 3-4 -->
  <path d="M 435 140 L 480 140" stroke="#2c3e50" stroke-width="2.5" fill="none" marker-end="url(#arrowdark)"/>

  <!-- Step 4: Prototype -->
  <g>
    <circle cx="545" cy="140" r="45" fill="#9b59b6" stroke="#7d3c98" stroke-width="2"/>
    <text x="545" y="135" class="step-label" fill="#fff">4</text>
    <text x="545" y="205" class="label" font-size="10" text-anchor="middle" font-weight="bold">Elegir</text>
    <text x="545" y="220" class="label" font-size="9" text-anchor="middle">y diseñar</text>
  </g>

  <!-- Arrow 4-5 -->
  <path d="M 590 140 L 635 140" stroke="#2c3e50" stroke-width="2.5" fill="none" marker-end="url(#arrowdark)"/>

  <!-- Step 5: Test -->
  <g>
    <circle cx="700" cy="140" r="45" fill="#27ae60" stroke="#229954" stroke-width="2"/>
    <text x="700" y="135" class="step-label" fill="#fff">5</text>
    <text x="700" y="205" class="label" font-size="10" text-anchor="middle" font-weight="bold">Planificar</text>
    <text x="700" y="220" class="label" font-size="9" text-anchor="middle">el trabajo</text>
  </g>

  <!-- Arrow 5-6 -->
  <path d="M 745 140 L 790 140" stroke="#2c3e50" stroke-width="2.5" fill="none" marker-end="url(#arrowdark)"/>

  <!-- Step 6: Improve -->
  <g>
    <circle cx="855" cy="140" r="45" fill="#16a085" stroke="#117a65" stroke-width="2"/>
    <text x="855" y="135" class="step-label" fill="#fff">6</text>
    <text x="855" y="205" class="label" font-size="10" text-anchor="middle" font-weight="bold">Construir</text>
    <text x="855" y="220" class="label" font-size="9" text-anchor="middle">el objeto</text>
  </g>

  <!-- Arrow 6-7 (downward) -->
  <path d="M 855 185 L 855 240" stroke="#2c3e50" stroke-width="2.5" fill="none" marker-end="url(#arrowdark)"/>

  <!-- Step 7: Document -->
  <g>
    <circle cx="855" cy="305" r="45" fill="#2980b9" stroke="#1a5276" stroke-width="2"/>
    <text x="855" y="300" class="step-label" fill="#fff">7</text>
    <text x="855" y="372" class="label" style="font-size: 10px; text-anchor: middle" font-weight="bold">Evaluar</text>
    <text x="855" y="388" class="label" style="font-size: 9px; text-anchor: middle">¿cumple?</text>
  </g>

  <!-- Feedback loop from 7 (evaluar) back to 4 (disenar) -->
  <path d="M 810 305 L 545 305 L 545 234" stroke="#e74c3c" stroke-width="2" fill="none" marker-end="url(#arrowdark)" stroke-dasharray="5,3"/>
  <text x="570" y="296" class="label" style="font-size: 9px" fill="#e74c3c">si no cumple, se vuelve al diseño</text>

  <!-- BOTTOM: Details -->
  <g>
    <rect x="30" y="410" width="940" height="270" fill="white" stroke="#2c3e50" stroke-width="1.5" rx="3"/>

    <text x="500" y="440" class="title" font-size="13">Qué se hace en cada paso</text>

    <g font-family="Arial" font-size="10.5" fill="#2c3e50" text-anchor="start">
      <text x="60" y="470"><tspan font-weight="bold">1. Detectar la necesidad</tspan></text>
      <text x="80" y="488">Qué falta y a quién le falta.</text>

      <text x="60" y="510"><tspan font-weight="bold">2. Analizar el problema</tspan></text>
      <text x="80" y="528">Qué condiciones tiene que cumplir la solución: los requisitos.</text>

      <text x="60" y="550"><tspan font-weight="bold">3. Buscar ideas</tspan></text>
      <text x="80" y="568">Varias, no una. Cuantas más, mejor la elegida.</text>

      <text x="60" y="590"><tspan font-weight="bold">4. Elegir y diseñar</tspan></text>
      <text x="80" y="608">Escoger una con un criterio y concretarla: medidas, materiales, piezas, dibujos.</text>

      <text x="60" y="630"><tspan font-weight="bold">5. Planificar</tspan></text>
      <text x="80" y="648">Quién hace qué, con qué y en cuánto tiempo.</text>

      <text x="500" y="470"><tspan font-weight="bold">6. Construir</tspan></text>
      <text x="520" y="488">Fabricar lo diseñado, siguiendo el plan.</text>

      <text x="500" y="510"><tspan font-weight="bold">7. Evaluar</tspan></text>
      <text x="520" y="528">¿Cumple los requisitos del paso 2? Si no, se vuelve atrás.</text>

      <text x="500" y="560" class="label" font-size="11" fill="#e74c3c" font-weight="bold">Esto no es lineal:</text>
      <text x="520" y="580">Casi siempre se vuelve atrás, y casi siempre al diseño (4).</text>
      <text x="520" y="598">Volver atrás no es fracasar: es cómo funciona.</text>
      <text x="520" y="616">Es lo que hace un ingeniero: itera hasta que funciona.</text>
    </g>
  </g>

</svg>