<svg viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font-family: Arial, sans-serif; font-size: 16px; font-weight: bold; text-anchor: middle; }
      .label { font-family: Arial, sans-serif; font-size: 12px; }
      .box { stroke: #2c3e50; stroke-width: 2; fill: #e8f4f8; }
      .good { fill: #d4edda; stroke: #27ae60; }
      .mono { font-family: 'Courier New', monospace; font-size: 11px; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1000" height="600" fill="#f8f9fa"/>

  <!-- Title -->
  <text x="500" y="35" class="title" font-size="18">Potencia y Energía Eléctrica</text>
  <text x="500" y="55" class="label" font-size="11" fill="#666" text-anchor="middle">La diferencia entre lo que gasta en el momento y lo que acumulas</text>

  <!-- LEFT: Power (Potencia) -->
  <g>
    <rect x="30" y="90" width="450" height="480" class="box" rx="5"/>
    <text x="255" y="120" class="title" font-size="14">POTENCIA (P)</text>
    <text x="255" y="140" class="label" font-size="10" fill="#666" text-anchor="middle">Energía por segundo · Se mide en VATIOS (W)</text>

    <!-- Formula -->
    <g>
      <rect x="60" y="160" width="390" height="60" fill="white" stroke="#3498db" stroke-width="2" rx="3"/>
      <text x="255" y="180" class="title" font-size="13">P = V × I</text>
      <text x="255" y="202" class="label" font-size="10" text-anchor="middle">Voltios · Amperios = Vatios</text>
    </g>

    <!-- Examples -->
    <g font-family="Arial" font-size="11" fill="#2c3e50" text-anchor="start">
      <text x="60" y="250"><b>LED:</b> 5 V × 0,02 A = 0,1 W (un décimo de vatio)</text>
      <text x="60" y="270"><b>Bombilla LED:</b> 230 V × 0,05 A = 11,5 W</text>
      <text x="60" y="290"><b>Tostadora: 230V × 5 A = 1.150 W (una plancha)</b></text>
      <text x="60" y="310"><b>Horno eléctrico:</b> 230 V × 15 A = 3.450 W</text>

      <text x="60" y="340"><b>¿Qué significa?</b></text>
      <text x="80" y="360">• Cuanta más potencia, más calor/luz/fuerza EN ESTE MOMENTO</text>
      <text x="80" y="378">• Una bombilla de 100 W gasta el doble de energía que una de 50 W</text>
      <text x="80" y="396">• La potencia es lo que ves en el momento: LED brillando, motor girando, resistencia calentando</text>

      <text x="60" y="430"><b>En la casa:</b></text>
      <text x="80" y="448">• 230 V es fijo. Lo que cambia es la Intensidad (Amperios)</text>
      <text x="80" y="466">• Más aparatos encendidos = más Amperios = más Potencia total = saltan los plomos</text>
    </g>
  </g>

  <!-- RIGHT: Energy (Energía) -->
  <g>
    <rect x="520" y="90" width="450" height="480" class="good" rx="5"/>
    <text x="745" y="120" class="title" font-size="14">ENERGÍA (E)</text>
    <text x="745" y="140" class="label" font-size="10" fill="#2c3e50" text-anchor="middle">Potencia × Tiempo · Se mide en JULIOS o kWh</text>

    <!-- Formula -->
    <g>
      <rect x="550" y="160" width="390" height="80" fill="white" stroke="#27ae60" stroke-width="2" rx="3"/>
      <text x="745" y="185" class="title" font-size="13">E = P × t</text>
      <text x="745" y="210" class="label" font-size="10" text-anchor="middle">Vatios × Segundos = Julios</text>
      <text x="745" y="230" class="label" font-size="10" text-anchor="middle">O bien: Vatios × Horas = Vatios·hora (Wh)</text>
    </g>

    <!-- Examples -->
    <g font-family="Arial" font-size="11" fill="#2c3e50" text-anchor="start">
      <text x="550" y="280"><b>Un LED de 0,1 W durante 1 hora:</b></text>
      <text x="570" y="298">E = 0,1 W × 3.600 s = 360 Julios</text>

      <text x="550" y="330"><b>Una plancha de 1.150 W durante 2 horas:</b></text>
      <text x="570" y="348">E = 1.150 W × 2 h = 2.300 Wh = 2,3 kWh</text>

      <text x="550" y="380"><b>¿Qué es un kWh?</b></text>
      <text x="570" y="398">• 1 kilowatio durante 1 hora = 1 kWh</text>
      <text x="570" y="416">• Es lo que ves en tu factura de electricidad</text>
      <text x="570" y="434">• Cuesta ~0,15 €/kWh (varía por zona)</text>

      <text x="550" y="468"><b>Tu móvil:</b> Batería de 3.000 mAh a 3,7 V</text>
      <text x="570" y="486">E = 3 Ah × 3,7 V = 11,1 Wh = 11,1 kiloJulios</text>
    </g>
  </g>

  <!-- BOTTOM: Comparison and key concepts -->
  <g>
    <rect x="30" y="590" width="920" height="0" fill="white"/>
  </g>

</svg>