<svg viewBox="-71.1 -15.8 1087 631.7" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .box { stroke: #2c3e50; stroke-width: 2; fill-opacity: 0.9; }
      .title { font-family: Arial, sans-serif; font-size: 14px; font-weight: bold; text-anchor: middle; }
      .label { font-family: Arial, sans-serif; font-size: 12px; text-anchor: middle; }
      .lever { stroke: #8b6914; stroke-width: 4; fill: #d4a574; }
      .force { stroke: #e74c3c; stroke-width: 3; fill: none; marker-end: url(#arrowred); }
      .load { stroke: #27ae60; stroke-width: 3; fill: none; marker-end: url(#arrowgreen); }
    </style>
    <marker id="arrowred" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#e74c3c"/>
    </marker>
    <marker id="arrowgreen" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="-71" y="-16" width="1087" height="632" fill="#f8f9fa"/>

  <!-- Title -->
  <text x="500" y="35" class="title" font-size="18">Ventaja Mecánica: Cómo hacer más con menos esfuerzo</text>

  <!-- Section 1: Class 1 Lever (Balanced) -->
  <g>
    <text x="100" y="90" class="title" font-size="12" text-anchor="start" font-weight="bold">Clase 1: PALANCA EQUILIBRADA</text>
    <text x="100" y="110" class="label" font-size="10" text-anchor="start" fill="#666">(Fulcro en el medio: Tenazas, Balancín)</text>

    <!-- Lever -->
    <line x1="30" y1="150" x2="200" y2="150" class="lever"/>

    <!-- Fulcrum -->
    <polygon points="115,150 110,175 120,175" fill="#2c3e50"/>
    <text x="115" y="195" class="label" font-size="9" font-weight="bold">Fulcro</text>

    <!-- Load -->
    <rect x="160" y="155" width="20" height="25" fill="#90ee90" stroke="#27ae60" stroke-width="2"/>
    <text x="170" y="205" class="label" font-size="9" font-weight="bold">CARGA</text>
    <text x="170" y="218" class="label" font-size="8">(100 kg)</text>

    <!-- Force -->
    <rect x="50" y="155" width="20" height="25" fill="#ffcccc" stroke="#e74c3c" stroke-width="2"/>
    <text x="60" y="205" class="label" font-size="9" font-weight="bold">FUERZA</text>
    <text x="60" y="218" class="label" font-size="8">(50 kg)</text>

    <!-- Distances -->
    <line x1="115" y1="160" x2="60" y2="160" stroke="#666" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="87" y="155" class="label" font-size="8" fill="#666">1m</text>

    <line x1="115" y1="160" x2="170" y2="160" stroke="#666" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="142" y="155" class="label" font-size="8" fill="#666">0.5m</text>

    <text x="60" y="245" class="label" font-size="9" text-anchor="middle" font-weight="bold">Ventaja: 2:1</text>
    <text x="60" y="260" class="label" font-size="8" text-anchor="middle">Aplicas 50kg para</text>
    <text x="60" y="272" class="label" font-size="8" text-anchor="middle">levantar 100kg</text>
  </g>

  <!-- Section 2: Class 2 Lever (Load in middle) -->
  <g>
    <text x="100" y="310" class="title" font-size="12" text-anchor="start" font-weight="bold">Clase 2: PALANCA CON CARGA EN MEDIO</text>
    <text x="100" y="330" class="label" font-size="10" text-anchor="start" fill="#666">(Carga entre fulcro y fuerza: Carretilla, Abridor de botellas)</text>

    <!-- Lever -->
    <line x1="30" y1="370" x2="200" y2="370" class="lever"/>

    <!-- Fulcrum (left) -->
    <polygon points="35,370 30,395 40,395" fill="#2c3e50"/>
    <text x="35" y="415" class="label" font-size="9" font-weight="bold">Fulcro</text>

    <!-- Load (middle) -->
    <rect x="100" y="375" width="20" height="25" fill="#90ee90" stroke="#27ae60" stroke-width="2"/>
    <text x="110" y="425" class="label" font-size="9" font-weight="bold">CARGA</text>
    <text x="110" y="438" class="label" font-size="8">(100 kg)</text>

    <!-- Force (right) -->
    <rect x="180" y="375" width="20" height="25" fill="#ffcccc" stroke="#e74c3c" stroke-width="2"/>
    <text x="190" y="425" class="label" font-size="9" font-weight="bold">FUERZA</text>
    <text x="190" y="438" class="label" font-size="8">(25 kg)</text>

    <!-- Distances -->
    <line x1="35" y1="380" x2="110" y2="380" stroke="#666" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="72" y="375" class="label" font-size="8" fill="#666">0.75m</text>

    <line x1="110" y1="380" x2="190" y2="380" stroke="#666" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="150" y="375" class="label" font-size="8" fill="#666">1m</text>

    <text x="60" y="465" class="label" font-size="9" text-anchor="middle" font-weight="bold">Ventaja: 4:1</text>
    <text x="60" y="480" class="label" font-size="8" text-anchor="middle">Aplicas 25kg para</text>
    <text x="60" y="492" class="label" font-size="8" text-anchor="middle">levantar 100kg</text>
  </g>

  <!-- Section 3: Key formulas -->
  <rect x="300" y="80" width="650" height="420" fill="#e8f4f8" stroke="#3498db" stroke-width="1" rx="5"/>

  <g font-family="Arial" font-size="11" fill="#2c3e50" text-anchor="start">
    <text x="330" y="110" font-weight="bold" font-size="12">La fórmula de la ventaja mecánica:</text>

    <rect x="340" y="125" width="600" height="50" fill="white" stroke="#3498db" stroke-width="1" rx="3"/>
    <text x="360" y="150" font-family="'Courier New', monospace" font-size="13" font-weight="bold">Ventaja Mecánica = Distancia de entrada / Distancia de salida</text>
    <text x="360" y="170" font-size="10">O equivalentemente: Carga que levantas / Fuerza que aplicas</text>

    <text x="330" y="210" font-weight="bold">Ejemplo práctico:</text>
    <text x="330" y="230">Si tu mano está a 1 metro del fulcro y el objeto está a 0.1 metros:</text>
    <text x="330" y="250">Ventaja = 1 m / 0.1 m = <tspan font-weight="bold">10:1</tspan></text>
    <text x="330" y="270">Aplicas 10 kg de fuerza = Levantas 100 kg</text>

    <text x="330" y="310" font-weight="bold">Regla de oro: Cambias fuerza por distancia</text>
    <text x="330" y="330">• Más distancia de entrada → Menos fuerza (pero te cansas más)</text>
    <text x="330" y="350">• Menos distancia de entrada → Más fuerza (pero ganas precisión)</text>
    <text x="330" y="370">• La ENERGÍA TOTAL no cambia (Energía = Fuerza × Distancia)</text>

    <text x="330" y="410" font-weight="bold" fill="#e74c3c">No hay máquina que multiplique energía:</text>
    <text x="330" y="430">Si ganas fuerza, pierdes distancia.</text>
    <text x="330" y="450">Si ganas distancia, pierdes fuerza.</text>
    <text x="330" y="470">Siempre hay un intercambio.</text>
  </g>
</svg>