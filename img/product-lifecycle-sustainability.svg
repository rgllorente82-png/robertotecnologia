<svg viewBox="-40.9 -20 1056.3 735.3" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font-family: Arial, sans-serif; font-size: 16px; font-weight: bold; text-anchor: middle; }
      .label { font-family: Arial, sans-serif; font-size: 12px; }
      .mono { font-family: 'Courier New', monospace; font-size: 10px; }
    </style>
    <marker id="arrowgreen" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="-41" y="-20" width="1056" height="735" fill="#f8f9fa"/>

  <!-- Title -->
  <text x="500" y="35" class="title" font-size="18">Ciclo de vida de un producto</text>
  <text x="500" y="55" class="label" font-size="11" fill="#666" text-anchor="middle">Dónde está el impacto ambiental real</text>

  <!-- Circular lifecycle diagram -->
  <!-- RAW MATERIALS -->
  <g>
    <circle cx="150" cy="200" r="50" fill="#d4a574" stroke="#8b6914" stroke-width="2.5"/>
    <text x="150" y="205" class="label" font-size="11" text-anchor="middle" font-weight="bold">1</text>
    <text x="150" y="280" class="title" font-size="12" text-anchor="middle">Materias Primas</text>
    <text x="150" y="298" class="label" font-size="10" text-anchor="middle">Extracción de</text>
    <text x="150" y="312" class="label" font-size="10" text-anchor="middle">recursos</text>
  </g>

  <!-- MANUFACTURING -->
  <g>
    <circle cx="350" cy="120" r="50" fill="#4285f4" stroke="#1a73e8" stroke-width="2.5"/>
    <text x="350" y="125" class="label" font-size="11" text-anchor="middle" font-weight="bold" fill="#fff">2</text>
    <text x="350" y="196" class="title" style="font-size: 12px; text-anchor: middle">Fabricación</text>
    <text x="350" y="212" class="label" style="font-size: 10px; text-anchor: middle">Transformación</text>
    <text x="350" y="226" class="label" style="font-size: 10px; text-anchor: middle">y ensamblaje</text>
  </g>

  <!-- TRANSPORTATION -->
  <g>
    <circle cx="550" cy="120" r="50" fill="#fbbc04" stroke="#d68910" stroke-width="2.5"/>
    <text x="550" y="125" class="label" font-size="11" text-anchor="middle" font-weight="bold">3</text>
    <text x="550" y="196" class="title" style="font-size: 12px; text-anchor: middle">Transporte</text>
    <text x="550" y="212" class="label" style="font-size: 10px; text-anchor: middle">A tiendas,</text>
    <text x="550" y="226" class="label" style="font-size: 10px; text-anchor: middle">a usuarios</text>
  </g>

  <!-- USE PHASE -->
  <g>
    <circle cx="750" cy="200" r="50" fill="#34a853" stroke="#229954" stroke-width="2.5"/>
    <text x="750" y="205" class="label" font-size="11" text-anchor="middle" font-weight="bold" fill="#fff">4</text>
    <text x="750" y="280" class="title" font-size="12" text-anchor="middle">Uso (años)</text>
    <text x="750" y="298" class="label" font-size="10" text-anchor="middle">Consumo de</text>
    <text x="750" y="312" class="label" font-size="10" text-anchor="middle">electricidad</text>
  </g>

  <!-- END OF LIFE -->
  <g>
    <circle cx="550" cy="340" r="50" fill="#ea4335" stroke="#c0392b" stroke-width="2.5"/>
    <text x="550" y="345" class="label" font-size="11" text-anchor="middle" font-weight="bold" fill="#fff">5</text>
    <text x="550" y="420" class="title" font-size="12" text-anchor="middle">Fin de vida</text>
    <text x="550" y="438" class="label" font-size="10" text-anchor="middle">Reciclaje,</text>
    <text x="550" y="452" class="label" font-size="10" text-anchor="middle">vertedero</text>
  </g>

  <!-- Arrows connecting the cycle -->
  <path d="M 200 150 Q 270 80 310 110" stroke="#27ae60" stroke-width="2.5" fill="none" marker-end="url(#arrowgreen)"/>
  <path d="M 400 110 L 500 110" stroke="#27ae60" stroke-width="2.5" fill="none" marker-end="url(#arrowgreen)"/>
  <path d="M 600 130 Q 680 150 710 180" stroke="#27ae60" stroke-width="2.5" fill="none" marker-end="url(#arrowgreen)"/>
  <path d="M 750 250 L 620 290" stroke="#27ae60" stroke-width="2.5" fill="none" marker-end="url(#arrowgreen)"/>
  <path d="M 480 360 Q 300 380 200 300" stroke="#27ae60" stroke-width="2.5" fill="none" marker-end="url(#arrowgreen)"/>

  <!-- Impact breakdown chart on right side -->
  <g>
    <rect x="30" y="480" width="940" height="200" fill="white" stroke="#2c3e50" stroke-width="1.5" rx="3"/>

    <text x="60" y="512" class="title" style="font-size: 13px; text-anchor: start">Impacto ambiental por fase · un móvil</text>

    <!-- Row 1: Manufacturing (76 %) -->
    <rect x="60" y="530" width="608" height="25" fill="#4285f4" stroke="#1a73e8" stroke-width="2"/>
    <text x="70" y="548" class="label" font-size="11" font-weight="bold" fill="#fff">Fabricarlo</text>
    <text x="678" y="548" class="label" font-size="11" font-weight="bold" fill="#1a73e8"><tspan font-weight="bold">76%</tspan></text>

    <!-- Row 2: Use (18 %) -->
    <rect x="60" y="565" width="144" height="25" fill="#34a853" stroke="#229954" stroke-width="1.5"/>
    <text x="70" y="583" class="label" font-size="11" font-weight="bold" fill="#fff">Uso (3 años)</text>
    <text x="214" y="583" class="label" font-size="11"><tspan font-weight="bold">18%</tspan> (cargarlo)</text>

    <!-- Row 3: Transport (4 %) -->
    <rect x="60" y="600" width="32" height="25" fill="#fbbc04" stroke="#d68910" stroke-width="1.5"/>
    <text x="102" y="618" class="label" font-size="11" font-weight="bold">Transporte</text>
    <text x="180" y="618" class="label" font-size="11"><tspan font-weight="bold">4%</tspan> (traerlo)</text>

    <!-- Row 4: End of life (1 %) -->
    <rect x="60" y="635" width="8" height="25" fill="#ea4335" stroke="#c0392b" stroke-width="1.5"/>
    <text x="102" y="653" class="label" font-size="11" font-weight="bold">Fin de vida</text>
    <text x="180" y="653" class="label" font-size="11"><tspan font-weight="bold">1%</tspan> (deshacerse de él)</text>

    <!-- Insight text -->
    <text x="500" y="674" class="label" font-size="10.5" text-anchor="middle" fill="#1a73e8" font-weight="bold">
      Ejemplo: iPhone 17 de 256 GB, 55 kg de CO₂e según Apple (suman 99 por el redondeo)
    </text>
    <text x="500" y="700" class="label" font-size="10" text-anchor="middle" fill="#666">
      En un móvil, fabricarlo pesa cuatro veces más que usarlo: lo que más baja su huella es que dure
    </text>
  </g>

  <!-- Left panel: Key insights -->
  <g>
    <text x="790" y="512" class="title" style="font-size: 12px; text-anchor: start">Lo que se deduce:</text>
    <text x="790" y="536" class="label" style="font-size: 10px">✓ Fabricar bien</text>
    <text x="790" y="556" class="label" style="font-size: 10px">✓ Que dure muchos años</text>
    <text x="790" y="576" class="label" style="font-size: 10px">✓ Bajo consumo en uso</text>
    <text x="790" y="596" class="label" style="font-size: 10px">✓ Fácil de reparar</text>
    <text x="790" y="616" class="label" style="font-size: 10px">✓ Reciclable al final</text>
  </g>

</svg>
