<svg viewBox="-93 -16.2 1109.2 732.3" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .box { stroke: #2c3e50; stroke-width: 2; fill-opacity: 0.9; }
      .title { font-family: Arial, sans-serif; font-size: 16px; font-weight: bold; text-anchor: middle; }
      .label { font-family: Arial, sans-serif; font-size: 12px; text-anchor: middle; }
      .stress-box { stroke: #2c3e50; stroke-width: 2; fill: #e8f4f8; }
      .arrow { stroke: #e74c3c; stroke-width: 3; fill: none; marker-end: url(#arrowred); }
      .arrow-good { stroke: #27ae60; stroke-width: 3; fill: none; marker-end: url(#arrowgreen); }
      .material { fill: #d4a574; stroke: #8b6914; stroke-width: 2; }
    </style>
    <marker id="arrowred" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#e74c3c"/>
    </marker>
    <marker id="arrowgreen" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="-93" y="-16" width="1109" height="732" fill="#f8f9fa"/>

  <!-- Title -->
  <text x="500" y="35" class="title" font-size="18">Los Cinco Esfuerzos en Estructuras</text>
  <text x="500" y="55" class="label" font-size="11" fill="#666">Cómo pueden deformarse o romperse los materiales</text>

  <!-- Row 1: COMPRESSION -->
  <g>
    <rect x="30" y="80" width="190" height="140" class="stress-box"/>
    <text x="125" y="105" class="label" font-weight="bold" font-size="13">COMPRESIÓN</text>
    <text x="125" y="120" class="label" font-size="10" fill="#666">Se aplasta / se comprime</text>

    <!-- Visual representation: cube being squashed -->
    <rect x="70" y="145" width="40" height="40" class="material"/>
    <text x="90" y="173" class="label" font-size="9">Normal</text>

    <path d="M130,155 L160,155" stroke="#e74c3c" stroke-width="3" marker-start="url(#arrowright)" fill="none"/>
    <path d="M170,155 L140,155" stroke="#e74c3c" stroke-width="3" marker-end="url(#arrowright)" fill="none"/>

    <rect x="120" y="150" width="50" height="30" class="material" opacity="0.7"/>
    <text x="145" y="173" class="label" font-size="9">Aplastado</text>
  </g>

  <!-- Row 2: TENSION -->
  <g>
    <rect x="270" y="80" width="190" height="140" class="stress-box"/>
    <text x="365" y="105" class="label" font-weight="bold" font-size="13">TRACCIÓN</text>
    <text x="365" y="120" class="label" font-size="10" fill="#666">Se estira / se alarga</text>

    <!-- Visual representation: cube being stretched -->
    <rect x="310" y="145" width="40" height="40" class="material"/>
    <text x="278" y="173" class="label" style="font-size: 9px">Normal</text>

    <path d="M300,160 L280,160" stroke="#e74c3c" stroke-width="3" marker-end="url(#arrowred)" fill="none"/>
    <path d="M380,160 L400,160" stroke="#e74c3c" stroke-width="3" marker-end="url(#arrowred)" fill="none"/>

    <rect x="300" y="150" width="70" height="30" class="material" opacity="0.7"/>
    <text x="336" y="186" class="label" style="font-size: 9px">Estirado</text>
  </g>

  <!-- Row 3: BENDING -->
  <g>
    <rect x="510" y="80" width="190" height="140" class="stress-box"/>
    <text x="605" y="105" class="label" font-weight="bold" font-size="13">FLEXIÓN</text>
    <text x="605" y="120" class="label" font-size="10" fill="#666">Se dobla / se curva</text>

    <!-- Visual representation: beam bending -->
    <line x1="550" y1="160" x2="630" y2="160" stroke="#8b6914" stroke-width="8"/>
    <text x="590" y="175" class="label" font-size="9">Recto</text>

    <path d="M560,155 L560,170" stroke="#e74c3c" stroke-width="2" fill="none"/>
    <path d="M620,155 L620,170" stroke="#e74c3c" stroke-width="2" fill="none"/>

    <path d="M550 160 Q590 145 630 160" stroke="#8b6914" stroke-width="8" fill="none"/>
    <text x="590" y="195" class="label" font-size="9">Doblado</text>
  </g>

  <!-- Row 4: TORSION -->
  <g>
    <rect x="750" y="80" width="220" height="140" class="stress-box"/>
    <text x="860" y="105" class="label" font-weight="bold" font-size="13">TORSIÓN</text>
    <text x="860" y="120" class="label" font-size="10" fill="#666">Se retuerce / gira</text>

    <!-- Visual representation: cylinder twisting -->
    <circle cx="800" cy="160" r="18" fill="none" stroke="#8b6914" stroke-width="6"/>
    <text x="810" y="165" class="label" font-size="12" font-weight="bold">↻</text>
    <text x="800" y="180" class="label" font-size="9">Normal</text>

    <text x="840" y="165" class="label" font-size="14">→</text>

    <circle cx="920" cy="160" r="18" fill="none" stroke="#8b6914" stroke-width="6" stroke-dasharray="2,3"/>
    <text x="920" y="167" class="label" font-size="10">↻↻</text>
    <text x="920" y="180" class="label" font-size="9">Retorcido</text>
  </g>

  <!-- Row 5: SHEAR/CORTANTE -->
  <g>
    <rect x="30" y="260" width="190" height="140" class="stress-box"/>
    <text x="125" y="285" class="label" font-weight="bold" font-size="13">CORTADURA (CIZALLA)</text>
    <text x="125" y="300" class="label" font-size="10" fill="#666">Se desliza / cizalla</text>

    <!-- Visual representation: shearing -->
    <rect x="70" y="325" width="40" height="40" class="material"/>
    <text x="90" y="375" class="label" font-size="9">Normal</text>

    <path d="M130,335 L150,325" stroke="#e74c3c" stroke-width="3" fill="none"/>
    <path d="M130,355 L110,345" stroke="#e74c3c" stroke-width="3" fill="none"/>

    <polygon points="110,330 150,330 140,350 100,350" class="material" opacity="0.7"/>
    <text x="125" y="370" class="label" font-size="9">Cortado</text>
  </g>

  <!-- Examples section -->
  <g>
    <rect x="270" y="260" width="700" height="140" class="stress-box"/>
    <text x="620" y="285" class="label" font-weight="bold" font-size="13">Ejemplos de la vida real</text>

    <g font-family="Arial" font-size="11" fill="#2c3e50" text-anchor="start">
      <text x="290" y="310"><tspan font-weight="bold">Compresión:</tspan> Las columnas de un edificio aguantan el peso de los pisos encima</text>
      <text x="290" y="330"><tspan font-weight="bold">Tracción:</tspan> Los cables de un puente colgante se estiran por el peso del tablero</text>
      <text x="290" y="350"><tspan font-weight="bold">Flexión:</tspan> Una viga de acero se dobla si la cargas en el medio (pero no debe romper)</text>
      <text x="290" y="370"><tspan font-weight="bold">Torsión:</tspan> Un tornillo se retuerce al entrar en el material, o un eje de motor</text>
      <text x="290" y="390"><tspan font-weight="bold">Cortadura:</tspan> Las tijeras cizallan: una hoja sube y otra baja, cortando el papel entre ellas</text>
    </g>
  </g>

  <!-- Key principle -->
  <g>
    <rect x="30" y="440" width="940" height="240" fill="#fff3cd" stroke="#f39c12" stroke-width="2" rx="5"/>

    <text x="50" y="465" class="label" font-weight="bold" font-size="12" text-anchor="start" fill="#e74c3c">La regla de oro: cada material tiene un límite</text>

    <g font-family="Arial" font-size="11" fill="#2c3e50" text-anchor="start">
      <text x="50" y="495"><tspan font-weight="bold">Acero:</tspan> Aguanta mucha tracción (por eso se usa en cables) y compresión (vigas), pero menos torsión</text>
      <text x="50" y="520"><tspan font-weight="bold">Hormigón:</tspan> Aguanta bien <tspan font-weight="bold">compresión</tspan> (columnas, muros) pero <tspan font-weight="bold">nada de tracción</tspan> (por eso se refuerza con acero)</text>
      <text x="50" y="545"><tspan font-weight="bold">Aluminio:</tspan> Más ligero que el acero, menos resistente, pero excelente para estructuras que no pesan mucho</text>
      <text x="50" y="570"><tspan font-weight="bold">Plástico impreso (3D):</tspan> Débil en todos los esfuerzos, especialmente en tracción y cortadura</text>
      <text x="50" y="595"><tspan font-weight="bold">Madera:</tspan> Resiste bien la compresión <tspan font-weight="bold">paralela</tspan> a las fibras (columna de madera), pero no la perpendicular</text>
      <text x="50" y="620"><tspan font-weight="bold">Evitar fallos:</tspan> Los ingenieros eligen materiales y formas para que el esfuerzo máximo que sufran sea menor que su límite de ruptura. Y dejan un margen de seguridad.</text>
      <text x="50" y="655"><tspan font-weight="bold">Triangular funciona:</tspan> Un triángulo no se deforma. Por eso se usan en cerchas, grúas y cualquier sitio donde necesites resistencia máxima</text>
    </g>
  </g>
</svg>