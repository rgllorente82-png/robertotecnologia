<svg viewBox="-96.4 -16.2 1112.6 652.4" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .box { stroke: #2c3e50; stroke-width: 2; fill-opacity: 0.9; }
      .title { font-family: Arial, sans-serif; font-size: 14px; font-weight: bold; text-anchor: middle; }
      .label { font-family: Arial, sans-serif; font-size: 12px; text-anchor: middle; }
      .arrow { stroke: #3498db; stroke-width: 2; fill: none; marker-end: url(#arrowright); }
      .comment-arrow { stroke: #f39c12; stroke-width: 2; fill: none; marker-end: url(#arroworange); }
    </style>
    <marker id="arrowright" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#3498db"/>
    </marker>
    <marker id="arroworange" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#f39c12"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="-96" y="-16" width="1113" height="652" fill="#f8f9fa"/>

  <!-- Title -->
  <text style="font-size: 18" x="500" y="35" class="title">Colaboración Digital: Edición Conjunta</text>

  <!-- Section 1: Without collaboration (Bad) -->
  <g>
    <text style="text-anchor: start; font-size: 12; font-weight: bold" x="50" y="85" class="title">❌ Método antiguo: Emails y conflictos</text>

    <!-- Person 1 -->
    <circle cx="80" cy="150" r="25" fill="#e74c3c"/>
    <text style="font-size: 10" x="80" y="156" class="label" fill="white">Ana</text>

    <!-- Document v1 -->
    <rect x="50" y="190" width="60" height="30" class="box" fill="#ecf0f1"/>
    <text style="font-size: 9" x="80" y="210" class="label">tarea_v1.docx</text>

    <!-- Email arrow -->
    <path d="M110,210 L170,210" class="arrow"/>

    <!-- Person 2 -->
    <circle cx="230" cy="150" r="25" fill="#3498db"/>
    <text style="font-size: 10" x="230" y="156" class="label" fill="white">Bob</text>

    <!-- Document v2 -->
    <rect x="190" y="190" width="80" height="30" class="box" fill="#ecf0f1"/>
    <text style="font-size: 9" x="230" y="210" class="label">tarea_v2_bob.docx</text>

    <!-- Problem arrow -->
    <path d="M80,220 L230,240" class="comment-arrow" stroke-dasharray="5,5"/>

    <!-- Conflict note -->
    <rect x="50" y="250" width="210" height="60" fill="#ffe8e8" stroke="#e74c3c" stroke-width="1" rx="3"/>
    <text style="text-anchor: start; font-size: 10" x="60" y="270" class="label" font-weight="bold">⚠ Conflicto:</text>
    <text style="text-anchor: start; font-size: 9" x="60" y="290" class="label">Los cambios de Ana se pierden</text>
    <text style="text-anchor: start; font-size: 9" x="60" y="305" class="label">¿Cuál es la versión correcta?</text>
  </g>

  <!-- Section 2: With cloud collaboration (Good) -->
  <g>
    <text style="text-anchor: start; font-size: 12; font-weight: bold" x="450" y="85" class="title">✓ Método moderno: Nube compartida</text>

    <!-- Cloud storage -->
    <circle cx="550" cy="130" r="35" fill="#3498db"/>
    <text style="font-size: 11" x="550" y="135" class="label" fill="white" font-weight="bold">NUBE</text>

    <!-- Ana -->
    <circle cx="450" cy="200" r="25" fill="#e74c3c"/>
    <text style="font-size: 10" x="450" y="206" class="label" fill="white">Ana</text>

    <!-- Arrow Ana to Cloud (edit) -->
    <path d="M475,210 L520,165" class="arrow"/>
    <text style="font-size: 9" x="495" y="190" class="label" fill="#666">edita</text>

    <!-- Bob -->
    <circle cx="650" cy="200" r="25" fill="#27ae60"/>
    <text style="font-size: 10" x="650" y="206" class="label" fill="white">Bob</text>

    <!-- Arrow Bob to Cloud (edita) -->
    <path d="M625,210 L580,165" class="arrow"/>
    <text style="font-size: 9" x="600" y="190" class="label" fill="#666">edita</text>

    <!-- Shared document (v3) -->
    <rect x="490" y="245" width="120" height="35" class="box" fill="#e8f4f8"/>
    <text style="font-size: 10" x="550" y="270" class="label">tarea_v3_FINAL.docx</text>

    <!-- Arrows from Cloud to Document -->
    <path d="M550,165 L520,245" class="arrow"/>
    <path d="M550,165 L580,245" class="arrow"/>

    <!-- Comment note -->
    <rect x="430" y="300" width="240" height="60" fill="#e8f4f8" stroke="#3498db" stroke-width="1" rx="3"/>
    <text style="text-anchor: start; font-size: 10" x="440" y="320" class="label" font-weight="bold">✓ Sincronizado:</text>
    <text style="text-anchor: start; font-size: 9" x="440" y="340" class="label">Una sola versión. Cambios visibles al instante</text>
    <text style="text-anchor: start; font-size: 9" x="440" y="355" class="label">Historial de quién cambió qué y cuándo</text>
  </g>

  <!-- Section 3: Comment system -->
  <g>
    <text style="text-anchor: start; font-size: 12; font-weight: bold" x="50" y="420" class="title">Comentarios: Feedback sin cambiar</text>

    <!-- Document with text -->
    <rect x="50" y="440" width="300" height="80" fill="white" stroke="#2c3e50" stroke-width="1" rx="3"/>
    <text style="text-anchor: start; font-size: 11" x="70" y="460" class="label" font-weight="bold">Documento:</text>
    <text style="text-anchor: start; font-size: 10" x="70" y="480" class="label">El algoritmo es muy <u style="text-decoration: underline; text-decoration-color: #f39c12; text-decoration-thickness: 2px;">complejo</u></text>

    <!-- Comment bubble -->
    <rect x="370" y="455" width="200" height="60" fill="#fff3cd" stroke="#f39c12" stroke-width="2" rx="5"/>
    <text style="text-anchor: start; font-size: 9" x="380" y="475" class="label" font-weight="bold">Bob comentó:</text>
    <text style="text-anchor: start; font-size: 9" x="380" y="495" class="label">"¿Podrías explicarlo</text>
    <text style="text-anchor: start; font-size: 9" x="380" y="510" class="label">con un ejemplo?"</text>

    <!-- Arrow from text to comment -->
    <path d="M350,475 L370,475" class="comment-arrow"/>

    <!-- Resolution -->
    <text style="text-anchor: start; font-size: 10" x="600" y="460" class="label" font-weight="bold">Ana responde:</text>
    <rect x="600" y="470" width="350" height="45" fill="#d4edda" stroke="#27ae60" stroke-width="1" rx="3"/>
    <text style="text-anchor: start; font-size: 9" x="615" y="490" class="label">"Hecho: añadí un gráfico explicativo."</text>
    <text style="text-anchor: start; font-size: 9" x="615" y="508" class="label" fill="#27ae60">✓ Comentario resuelto</text>
  </g>

  <!-- Section 4: Version history -->
  <g>
    <text style="text-anchor: start; font-size: 11; font-weight: bold" x="50" y="555" class="title">Historial de versiones:</text>
    <g font-family="Arial" font-size="9" fill="#2c3e50" text-anchor="start">
      <text x="50" y="575">15:30 - Bob: "Añadido resumen"</text>
      <text x="50" y="590">15:15 - Ana: "Corregida ortografía"</text>
      <text x="50" y="605">14:45 - Bob: "Primera versión"</text>
    </g>

    <rect x="550" y="555" width="400" height="65" fill="#e8f4f8" stroke="#3498db" stroke-width="1" rx="3"/>
    <text style="text-anchor: start; font-size: 10" x="570" y="575" class="label" font-weight="bold">Ventaja: Volver a cualquier versión anterior sin perder nada</text>
    <text style="text-anchor: start; font-size: 9" x="570" y="595" class="label">Google Docs, OneDrive, Notion, etc. mantienen todo el historial</text>
  </g>
</svg>