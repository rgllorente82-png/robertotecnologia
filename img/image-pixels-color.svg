<svg viewBox="0 0 1000 650" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .box { stroke: #2c3e50; stroke-width: 2; fill-opacity: 0.9; }
      .title { font-family: Arial, sans-serif; font-size: 14px; font-weight: bold; text-anchor: middle; }
      .label { font-family: Arial, sans-serif; font-size: 12px; text-anchor: middle; }
      .pixel { stroke: #333; stroke-width: 1; }
      .mono { font-family: 'Courier New', monospace; font-size: 10px; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1000" height="650" fill="#f8f9fa"/>

  <!-- Title -->
  <text x="500" y="35" class="title" font-size="18">Una Imagen es una Grilla de Píxeles</text>

  <!-- Section 1: What is a pixel -->
  <g>
    <text x="50" y="85" class="title" font-size="13" text-anchor="start" font-weight="bold">PÍXEL: Punto de color indivisible</text>

    <!-- Zoomed pixel -->
    <g transform="translate(50, 105)">
      <rect x="0" y="0" width="80" height="80" class="pixel" fill="#e74c3c"/>
      <text x="40" y="50" class="label" fill="white" font-weight="bold">1 píxel</text>
    </g>

    <!-- 4x4 grid of pixels -->
    <text x="180" y="105" class="label" font-size="11" font-weight="bold">Muchos píxeles:</text>
    <g transform="translate(180, 120)">
      <!-- Row 1 -->
      <rect x="0" y="0" width="20" height="20" class="pixel" fill="#e74c3c"/>
      <rect x="20" y="0" width="20" height="20" class="pixel" fill="#f39c12"/>
      <rect x="40" y="0" width="20" height="20" class="pixel" fill="#3498db"/>
      <rect x="60" y="0" width="20" height="20" class="pixel" fill="#27ae60"/>

      <!-- Row 2 -->
      <rect x="0" y="20" width="20" height="20" class="pixel" fill="#f39c12"/>
      <rect x="20" y="20" width="20" height="20" class="pixel" fill="#3498db"/>
      <rect x="40" y="20" width="20" height="20" class="pixel" fill="#27ae60"/>
      <rect x="60" y="20" width="20" height="20" class="pixel" fill="#9b59b6"/>

      <!-- Row 3 -->
      <rect x="0" y="40" width="20" height="20" class="pixel" fill="#3498db"/>
      <rect x="20" y="40" width="20" height="20" class="pixel" fill="#27ae60"/>
      <rect x="40" y="40" width="20" height="20" class="pixel" fill="#9b59b6"/>
      <rect x="60" y="40" width="20" height="20" class="pixel" fill="#1abc9c"/>

      <!-- Row 4 -->
      <rect x="0" y="60" width="20" height="20" class="pixel" fill="#27ae60"/>
      <rect x="20" y="60" width="20" height="20" class="pixel" fill="#9b59b6"/>
      <rect x="40" y="60" width="20" height="20" class="pixel" fill="#1abc9c"/>
      <rect x="60" y="60" width="20" height="20" class="pixel" fill="#95a5a6"/>
    </g>

    <text x="300" y="135" class="label" font-size="10" text-anchor="start" font-weight="bold">= Imagen</text>
  </g>

  <!-- Section 2: Resolution and file size -->
  <g>
    <text x="50" y="250" class="title" font-size="13" text-anchor="start" font-weight="bold">Resolución: ¿Cuántos píxeles?</text>

    <rect x="50" y="270" width="900" height="140" fill="#e8f4f8" stroke="#3498db" stroke-width="1" rx="5"/>

    <g font-family="Arial" font-size="10" fill="#2c3e50" text-anchor="start">
      <text x="70" y="290" font-weight="bold">Resolución</text>
      <text x="250" y="290" font-weight="bold">Píxeles totales</text>
      <text x="450" y="290" font-weight="bold">Tamaño aproximado (JPG)</text>
      <text x="720" y="290" font-weight="bold">Uso</text>

      <line x1="50" y1="300" x2="950" y2="300" stroke="#3498db" stroke-width="1"/>

      <!-- VGA -->
      <text x="70" y="325">640 × 480</text>
      <text x="250" y="325">307.200</text>
      <text x="450" y="325">50 KB</text>
      <text x="720" y="325">Web antigua</text>

      <!-- HD -->
      <text x="70" y="350">1280 × 720 (HD)</text>
      <text x="250" y="350">921.600</text>
      <text x="450" y="350">200 KB</text>
      <text x="720" y="350">Vídeo web</text>

      <!-- Full HD -->
      <text x="70" y="375">1920 × 1080 (Full HD)</text>
      <text x="250" y="375">2.073.600</text>
      <text x="450" y="375">500 KB - 1 MB</text>
      <text x="720" y="375">Foto móvil</text>

      <!-- 4K -->
      <text x="70" y="400">3840 × 2160 (4K)</text>
      <text x="250" y="400">8.294.400</text>
      <text x="450" y="400">2-4 MB</text>
      <text x="720" y="400">Foto profesional</text>
    </g>
  </g>

  <!-- Section 3: RGB Colors -->
  <g>
    <text x="50" y="450" class="title" font-size="13" text-anchor="start" font-weight="bold">RGB: Cada píxel es un número = un color</text>

    <g transform="translate(50, 470)">
      <!-- Red -->
      <rect x="0" y="0" width="60" height="60" fill="#ff0000"/>
      <text x="30" y="38" class="label" fill="white" font-size="11" font-weight="bold">R=255</text>
      <text x="30" y="78" class="label" font-size="10">Rojo</text>

      <!-- Green -->
      <rect x="80" y="0" width="60" height="60" fill="#00ff00"/>
      <text x="110" y="38" class="label" fill="black" font-size="11" font-weight="bold">G=255</text>
      <text x="110" y="78" class="label" font-size="10">Verde</text>

      <!-- Blue -->
      <rect x="160" y="0" width="60" height="60" fill="#0000ff"/>
      <text x="190" y="38" class="label" fill="white" font-size="11" font-weight="bold">B=255</text>
      <text x="190" y="78" class="label" font-size="10">Azul</text>

      <!-- White (RGB = 255,255,255) -->
      <rect x="240" y="0" width="60" height="60" class="pixel" fill="white"/>
      <text x="270" y="32" class="label" fill="#2c3e50" font-size="10" font-weight="bold">R=255</text>
      <text x="270" y="46" class="label" fill="#2c3e50" font-size="10" font-weight="bold">G=255</text>
      <text x="270" y="60" class="label" fill="#2c3e50" font-size="10" font-weight="bold">B=255</text>
      <text x="270" y="78" class="label" font-size="10">Blanco</text>

      <!-- Black (RGB = 0,0,0) -->
      <rect x="320" y="0" width="60" height="60" class="pixel" fill="black"/>
      <text x="350" y="32" class="label" fill="white" font-size="10" font-weight="bold">R=0</text>
      <text x="350" y="46" class="label" fill="white" font-size="10" font-weight="bold">G=0</text>
      <text x="350" y="60" class="label" fill="white" font-size="10" font-weight="bold">B=0</text>
      <text x="350" y="78" class="label" font-size="10">Negro</text>
    </g>

    <text x="50" y="590" class="label" font-size="10" text-anchor="start" font-weight="bold">Fórmula RGB:</text>
    <text x="50" y="608" class="label" font-size="10" text-anchor="start">Cada valor de 0-255 × 3 colores = 16,7 millones de colores posibles</text>
    <text x="50" y="625" class="label" font-size="10" text-anchor="start" fill="#666">(256 × 256 × 256 = 16.777.216 colores distintos)</text>
  </g>
</svg>