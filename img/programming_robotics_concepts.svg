<svg viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .concept-box { stroke-width: 2; rx: 5; }
      .concept-title { font-size: 13px; font-weight: bold; }
      .concept-text { font-size: 10px; }
    </style>
  </defs>

  <text x="500" y="35" style="font-size: 22px; font-weight: bold; text-anchor: middle;">Programación y Robótica</text>
  <text x="500" y="55" style="font-size: 13px; fill: #666; text-anchor: middle;">Conceptos fundamentales con micro:bit</text>

  <!-- MICROBIT -->
  <g id="microbit-section">
    <text x="150" y="90" style="font-size: 14px; font-weight: bold; fill: #D32F2F;">¿QUÉ ES MICRO:BIT?</text>

    <!-- microbit visual -->
    <rect x="50" y="105" width="200" height="120" fill="#1A1A2E" stroke="#D32F2F" stroke-width="2" rx="3"/>
    <text x="150" y="130" style="font-size: 11px; fill: #FFF; text-anchor: middle; font-weight: bold;">micro:bit</text>

    <!-- LED grid -->
    <g id="led-grid">
      <circle cx="90" cy="145" r="3" fill="#FF5252"/>
      <circle cx="100" cy="145" r="3" fill="#FF5252"/>
      <circle cx="110" cy="145" r="3" fill="#FF5252"/>
      <circle cx="120" cy="145" r="3" fill="#FF5252"/>
      <circle cx="130" cy="145" r="3" fill="#FF5252"/>

      <circle cx="90" cy="155" r="3" fill="#FF5252"/>
      <circle cx="100" cy="155" r="3" fill="#FF5252"/>
      <circle cx="110" cy="155" r="3" fill="#FFF" opacity="0.3"/>
      <circle cx="120" cy="155" r="3" fill="#FF5252"/>
      <circle cx="130" cy="155" r="3" fill="#FF5252"/>

      <circle cx="90" cy="165" r="3" fill="#FF5252"/>
      <circle cx="100" cy="165" r="3" fill="#FF5252"/>
      <circle cx="110" cy="165" r="3" fill="#FF5252"/>
      <circle cx="120" cy="165" r="3" fill="#FF5252"/>
      <circle cx="130" cy="165" r="3" fill="#FF5252"/>

      <circle cx="90" cy="175" r="3" fill="#FF5252"/>
      <circle cx="100" cy="175" r="3" fill="#FF5252"/>
      <circle cx="110" cy="175" r="3" fill="#FFF" opacity="0.3"/>
      <circle cx="120" cy="175" r="3" fill="#FF5252"/>
      <circle cx="130" cy="175" r="3" fill="#FF5252"/>

      <circle cx="90" cy="185" r="3" fill="#FF5252"/>
      <circle cx="100" cy="185" r="3" fill="#FF5252"/>
      <circle cx="110" cy="185" r="3" fill="#FF5252"/>
      <circle cx="120" cy="185" r="3" fill="#FF5252"/>
      <circle cx="130" cy="185" r="3" fill="#FF5252"/>
    </g>

    <!-- Buttons -->
    <rect x="80" y="200" width="15" height="18" fill="#666" stroke="#999" stroke-width="1" rx="2"/>
    <text x="87" y="207" style="font-size: 8px; fill: #FFF; text-anchor: middle;">A</text>

    <rect x="155" y="200" width="15" height="18" fill="#666" stroke="#999" stroke-width="1" rx="2"/>
    <text x="162" y="207" style="font-size: 8px; fill: #FFF; text-anchor: middle;">B</text>

    <text x="150" y="243" style="font-size: 10px; text-anchor: middle; fill: #333;">Placa con procesador,</text>
    <text x="150" y="256" style="font-size: 10px; text-anchor: middle; fill: #333;">sensores y conectores</text>
  </g>

  <!-- SENSORS -->
  <g id="sensors-section">
    <text x="500" y="90" style="font-size: 14px; font-weight: bold; fill: #1976D2;">SENSORES</text>

    <!-- Temperature sensor -->
    <rect x="380" y="105" width="90" height="60" fill="#FFEBEE" stroke="#1976D2" stroke-width="1.5" rx="3" class="concept-box"/>
    <text x="425" y="125" class="concept-title" style="text-anchor: middle; font-size: 12px" fill="#1976D2">Temperatura</text>
    <text x="425" y="140" class="concept-text" text-anchor="middle" fill="#666">Mide calor</text>
    <text x="425" y="152" class="concept-text" text-anchor="middle" fill="#666">o frío</text>

    <!-- Light sensor -->
    <rect x="485" y="105" width="90" height="60" fill="#FFF8E1" stroke="#1976D2" stroke-width="1.5" rx="3" class="concept-box"/>
    <text x="530" y="125" class="concept-title" style="text-anchor: middle; font-size: 12px" fill="#1976D2">Luz (LDR)</text>
    <text x="530" y="140" class="concept-text" text-anchor="middle" fill="#666">Detecta</text>
    <text x="530" y="152" class="concept-text" text-anchor="middle" fill="#666">luminosidad</text>

    <!-- Accelerometer -->
    <rect x="590" y="105" width="90" height="60" fill="#E8F5E9" stroke="#1976D2" stroke-width="1.5" rx="3" class="concept-box"/>
    <text x="635" y="125" class="concept-title" style="text-anchor: middle; font-size: 12px" fill="#1976D2">Movimiento</text>
    <text x="635" y="140" class="concept-text" text-anchor="middle" fill="#666">Aceleración y</text>
    <text x="635" y="152" class="concept-text" text-anchor="middle" fill="#666">rotación</text>
  </g>

  <!-- PROGRAMMING CONCEPTS -->
  <g id="concepts-section">
    <text x="150" y="290" style="font-size: 14px; font-weight: bold; fill: #F57C00;">BLOQUES DE PROGRAMACIÓN</text>

    <!-- BUCLES -->
    <rect x="50" y="305" width="85" height="80" fill="#FFF3E0" stroke="#F57C00" stroke-width="2" rx="3"/>
    <text x="92.5" y="325" class="concept-title" text-anchor="middle" fill="#F57C00">BUCLES</text>
    <text x="92.5" y="345" class="concept-text" text-anchor="middle" fill="#333;">Repetir acciones</text>
    <text x="92.5" y="358" class="concept-text" text-anchor="middle" fill="#333;">una cantidad</text>
    <text x="92.5" y="371" class="concept-text" text-anchor="middle" fill="#333;">de veces</text>

    <!-- CONDICIONALES -->
    <rect x="155" y="305" width="85" height="80" fill="#F3E5F5" stroke="#7B1FA2" stroke-width="2" rx="3"/>
    <text x="197.5" y="325" class="concept-title" style="text-anchor: middle; font-size: 10.5px" fill="#7B1FA2">SI… ENTONCES</text>
    <text x="197.5" y="345" class="concept-text" text-anchor="middle" fill="#333;">Tomar</text>
    <text x="197.5" y="358" class="concept-text" text-anchor="middle" fill="#333;">decisiones</text>
    <text x="197.5" y="371" class="concept-text" text-anchor="middle" fill="#333;">según condiciones</text>

    <!-- VARIABLES -->
    <rect x="260" y="305" width="85" height="80" fill="#E1F5FE" stroke="#0277BD" stroke-width="2" rx="3"/>
    <text x="302.5" y="325" class="concept-title" text-anchor="middle" fill="#0277BD">VARIABLES</text>
    <text x="302.5" y="345" class="concept-text" text-anchor="middle" fill="#333;">Guardar y usar</text>
    <text x="302.5" y="358" class="concept-text" text-anchor="middle" fill="#333;">datos (números,</text>
    <text x="302.5" y="371" class="concept-text" text-anchor="middle" fill="#333;">texto...)</text>
  </g>

  <!-- ALGORITHM FLOW -->
  <g id="algorithm-section">
    <text x="500" y="290" style="font-size: 14px; font-weight: bold; fill: #1976D2;">¿QUÉ ES UN ALGORITMO?</text>

    <rect x="380" y="299" width="240" height="98" fill="#C8E6C9" stroke="#388E3C" stroke-width="2" rx="3"/>

    <text x="500" y="322" style="font-size: 11px; text-anchor: middle; fill: #333; font-weight: bold;">Conjunto ordenado de pasos</text>
    <text x="500" y="340" style="font-size: 10px; text-anchor: middle; fill: #333;">para resolver un problema</text>
    <text x="500" y="355" style="font-size: 10px; text-anchor: middle; fill: #333;">de forma automática</text>

    <text x="500" y="375" style="font-size: 9px; text-anchor: middle; fill: #666; font-style: italic;">Ejemplo: un algoritmo que enciende</text>
    <text x="500" y="388" style="font-size: 9px; text-anchor: middle; fill: #666; font-style: italic;">el LED si hace oscuridad</text>
  </g>

  <!-- BOTTOM PROGRAM FLOW -->
  <g id="program-flow">
    <text x="80" y="415" style="font-size: 14px; font-weight: bold; fill: #333;">ESTRUCTURA DE UN PROGRAMA</text>

    <!-- START -->
    <rect x="80" y="435" width="70" height="35" rx="17.5" fill="#4CAF50" stroke="#2E7D32" stroke-width="2"/>
    <text x="115" y="458" style="font-size: 11px; text-anchor: middle; fill: #FFF; font-weight: bold;">INICIO</text>

    <!-- Arrow -->
    <path d="M 115 470 L 115 490" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" fill="none"/>

    <!-- SETUP -->
    <rect x="80" y="490" width="70" height="35" fill="#2196F3" stroke="#1565C0" stroke-width="2" rx="3"/>
    <text x="115" y="512" style="font-size: 9px; text-anchor: middle; fill: #FFF; font-weight: bold;">CONFIGURAR</text>

    <!-- Arrow -->
    <path d="M 115 525 L 115 545" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" fill="none"/>

    <!-- LOOP -->
    <rect x="70" y="545" width="90" height="35" fill="#FF9800" stroke="#E65100" stroke-width="2" rx="3"/>
    <text x="115" y="567" style="font-size: 9px; text-anchor: middle; fill: #FFF; font-weight: bold;">BUCLE INFINITO</text>

    <!-- Arrow back -->
    <path d="M 160 562.5 L 185 562.5 L 185 452 L 152 452" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" fill="none"/>
    <text x="192" y="510" style="font-size: 10px; fill: #333;">se repite</text>

    <!-- Description -->
    <text x="250" y="455" style="font-size: 11px; fill: #333;">1. El programa <tspan font-weight="bold">inicia</tspan></text>
    <text x="250" y="475" style="font-size: 11px; fill: #333;">2. Se <tspan font-weight="bold">configura</tspan> una vez</text>
    <text x="250" y="495" style="font-size: 11px; fill: #333;">3. El <tspan font-weight="bold">bucle infinito</tspan> se</text>
    <text x="250" y="510" style="font-size: 11px; fill: #333;">   repite continuamente</text>
    <text x="250" y="530" style="font-size: 11px; fill: #333;">4. El programa <tspan font-weight="bold">nunca termina</tspan></text>
    <text x="250" y="550" style="font-size: 11px; fill: #333;">   (a menos que se apague)</text>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#333"/>
    </marker>
  </g>
</svg>