<svg viewBox="-15 -15 1030 742.9" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font-family: Arial, sans-serif; font-size: 16px; font-weight: bold; text-anchor: middle; }
      .label { font-family: Arial, sans-serif; font-size: 12px; }
      .check { font-size: 14px; }
    </style>
  </defs>

  <!-- Background -->
  <rect x="-15" y="-15" width="1030" height="743" fill="#f8f9fa"/>

  <!-- Title -->
  <text x="500" y="35" class="title" font-size="18">Tecnología Apropiada</text>
  <text x="500" y="55" class="label" font-size="11" fill="#666" text-anchor="middle">No siempre la más avanzada es la mejor para cada problema</text>

  <!-- LEFT: BAD EXAMPLE -->
  <g>
    <rect x="30" y="90" width="450" height="300" fill="#f8d7da" stroke="#e74c3c" stroke-width="2" rx="5"/>
    <text x="255" y="120" class="title" font-size="13">❌ Tecnología INADECUADA</text>

    <!-- Illustration: robot to water plants -->
    <circle cx="100" cy="160" r="25" fill="#ea4335" stroke="#c0392b" stroke-width="2"/>
    <text x="100" y="165" class="label" font-size="9" text-anchor="middle" fill="#fff" font-weight="bold">🤖</text>
    <text x="160" y="165" class="label" font-size="10">→ Riego automático con</text>
    <text x="160" y="180" class="label" font-size="10">robot inteligente con IA</text>

    <g font-family="Arial" font-size="10" fill="#2c3e50" text-anchor="start">
      <text x="60" y="220"><b>El problema:</b></text>
      <text x="80" y="240">❌ Coste: €€€€€ (miles)</text>
      <text x="80" y="255">❌ Mantenimiento complejo</text>
      <text x="80" y="270">❌ Se rompe → sin riego</text>
      <text x="80" y="285">❌ Consumo de energía alto</text>
      <text x="80" y="300">❌ Excesiva para la tarea</text>

      <text x="60" y="340"><b>Resultado:</b> Fracaso. Todos</text>
      <text x="60" y="355">compran un sistema simple.</text>
    </g>
  </g>

  <!-- RIGHT: GOOD EXAMPLE -->
  <g>
    <rect x="520" y="90" width="450" height="300" fill="#d4edda" stroke="#27ae60" stroke-width="2" rx="5"/>
    <text x="745" y="120" class="title" font-size="13">✓ Tecnología APROPIADA</text>

    <!-- Illustration: simple sensor -->
    <circle cx="590" cy="160" r="25" fill="#34a853" stroke="#229954" stroke-width="2"/>
    <text x="590" y="165" class="label" font-size="14" text-anchor="middle" fill="#fff">💧</text>
    <text x="650" y="165" class="label" font-size="10">→ Sensor de humedad</text>
    <text x="650" y="180" class="label" font-size="10">+ electroválvula de riego</text>

    <g font-family="Arial" font-size="10" fill="#2c3e50" text-anchor="start">
      <text x="550" y="220"><b>Las ventajas:</b></text>
      <text x="570" y="240">✓ Coste: €€ (decenas)</text>
      <text x="570" y="255">✓ Simple de mantener</text>
      <text x="570" y="270">✓ Si se rompe, fácil cambio</text>
      <text x="570" y="285">✓ Bajo consumo de energía</text>
      <text x="570" y="300">✓ Justa para la tarea</text>

      <text x="550" y="340"><b>Resultado:</b> Funciona años.</text>
      <text x="550" y="355">Todos la copian.</text>
    </g>
  </g>

  <!-- BOTTOM: Definition and criteria -->
  <g>
    <rect x="30" y="410" width="940" height="270" fill="white" stroke="#2c3e50" stroke-width="1.5" rx="3"/>

    <text x="500" y="440" class="title" font-size="13">¿Qué hace que una tecnología sea APROPIADA?</text>

    <g font-family="Arial" font-size="11" fill="#2c3e50" text-anchor="start">
      <text x="60" y="470"><b>1. ESCALA correcta</b></text>
      <text x="80" y="488">   Para una persona o un pueblo, no necesitas lo mismo que para una ciudad.</text>
      <text x="80" y="505">   Ejemplo: El riego con sensor es escala personal. Un smartphone no lo es para un granjero.</text>

      <text x="60" y="535"><b>2. COSTE proporcionado</b></text>
      <text x="80" y="553">   Si gasta €100 en mantener algo que te ahorra €50/año, está mal.</text>
      <text x="80" y="570">   ROI (retorno de inversión): ¿cuánto tiempo tarda en pagarse a sí mismo?</text>

      <text x="60" y="600"><b>3. MANTENIBILIDAD local</b></text>
      <text x="80" y="618">   Si se rompe, ¿puede repararlo alguien del lugar?</text>
      <text x="80" y="635">   Si solo el fabricante puede repararla, no es apropiada para pueblos remotos.</text>

      <text x="60" y="665"><b>4. SOSTENIBILIDAD real</b></text>
      <text x="80" y="683">   Consumo de energía, disponibilidad de piezas, facilidad de reciclaje.</text>
    </g>
  </g>

  <!-- EXAMPLES GALLERY at very bottom -->
  <g>
    <text x="500" y="710" class="label" font-size="10" text-anchor="middle" fill="#666" font-weight="bold">
      Ejemplos: Una bicicleta es tecnología apropiada. Un coche sin carreteras, no. Una vela es apropiada en el mar. Una batería caduca es inútil.
    </text>
  </g>

</svg>
