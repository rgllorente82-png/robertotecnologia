<svg viewBox="0 0 1000 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .phase-title { font-family: Arial, sans-serif; font-size: 13px; font-weight: bold; text-anchor: middle; }
      .phase-label { font-family: Arial, sans-serif; font-size: 11px; text-anchor: middle; }
      .arrow { stroke: #3498db; stroke-width: 2.5; fill: none; marker-end: url(#arrowright); }
      .cycle-arrow { stroke: #27ae60; stroke-width: 3; fill: none; marker-end: url(#arrowgreen); }
    </style>
    <marker id="arrowright" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#3498db"/>
    </marker>
    <marker id="arrowgreen" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1000" height="500" fill="#f8f9fa"/>

  <!-- Title -->
  <text x="500" y="35" class="phase-title" font-size="18">Ciclo de Vida del Material</text>

  <!-- Phase 1: Extraction -->
  <circle cx="150" cy="200" r="60" fill="#e74c3c" stroke="#c0392b" stroke-width="2"/>
  <text x="150" y="195" class="phase-title" fill="white">EXTRACCIÓN</text>
  <text x="150" y="212" class="phase-label" fill="white">Minería</text>
  <text x="150" y="285" class="phase-label">↓ Energía (mina)</text>

  <!-- Arrow 1 -->
  <path d="M210,200 L290,200" class="arrow"/>

  <!-- Phase 2: Processing -->
  <circle cx="350" cy="200" r="60" fill="#f39c12" stroke="#d68910" stroke-width="2"/>
  <text x="350" y="195" class="phase-title" fill="white">PROCESAMIENTO</text>
  <text x="350" y="212" class="phase-label" fill="white">Refinación</text>
  <text x="350" y="285" class="phase-label">↓ Energía (calor)</text>

  <!-- Arrow 2 -->
  <path d="M410,200 L490,200" class="arrow"/>

  <!-- Phase 3: Manufacturing -->
  <circle cx="550" cy="200" r="60" fill="#3498db" stroke="#2980b9" stroke-width="2"/>
  <text x="550" y="195" class="phase-title" fill="white">FABRICACIÓN</text>
  <text x="550" y="212" class="phase-label" fill="white">Producción</text>
  <text x="550" y="285" class="phase-label">↓ Energía (proceso)</text>

  <!-- Arrow 3 -->
  <path d="M610,200 L690,200" class="arrow"/>

  <!-- Phase 4: Distribution -->
  <circle cx="750" cy="200" r="60" fill="#9b59b6" stroke="#8e44ad" stroke-width="2"/>
  <text x="750" y="195" class="phase-title" fill="white">DISTRIBUCIÓN</text>
  <text x="750" y="212" class="phase-label" fill="white">Transporte</text>
  <text x="750" y="285" class="phase-label">↓ Energía (logística)</text>

  <!-- Arrow 4: Down -->
  <path d="M750,260 L750,320" class="arrow"/>

  <!-- Phase 5: Use -->
  <circle cx="750" cy="380" r="60" fill="#27ae60" stroke="#229954" stroke-width="2"/>
  <text x="750" y="375" class="phase-title" fill="white">USO</text>
  <text x="750" y="392" class="phase-label" fill="white">Producto final</text>

  <!-- Left side: End of Life options -->

  <!-- Option 1: Landfill (Bad) -->
  <g>
    <rect x="50" y="350" width="140" height="100" fill="#ecf0f1" stroke="#e74c3c" stroke-width="2" rx="5"/>
    <text x="120" y="375" class="phase-title" font-size="12" fill="#e74c3c">❌ VERTEDERO</text>
    <text x="120" y="395" class="phase-label">Pérdida total</text>
    <text x="120" y="410" class="phase-label">de material</text>
    <text x="120" y="425" class="phase-label">Contaminación</text>
  </g>

  <!-- Option 2: Recycling (Good) -->
  <circle cx="150" cy="80" r="50" fill="#27ae60" stroke="#229954" stroke-width="2"/>
  <text x="150" y="75" class="phase-title" fill="white">♻ RECICLAJE</text>
  <text x="150" y="92" class="phase-label" fill="white">Nueva vida</text>

  <!-- Recycling arrow back -->
  <path d="M100,120 Q50,160 100,200" class="cycle-arrow"/>
  <text x="40" y="160" class="phase-label" fill="#27ae60">↻ Vuelve</text>
  <text x="40" y="175" class="phase-label" fill="#27ae60">a Extracción</text>

  <!-- Right side: Impact indicators -->
  <rect x="800" y="120" width="170" height="220" fill="#e8f4f8" stroke="#3498db" stroke-width="1" rx="5"/>

  <text x="815" y="145" class="phase-title" font-size="12">Impacto por fase:</text>

  <g font-family="Arial" font-size="10" fill="#2c3e50">
    <text x="820" y="170">Extracción: 40%</text>
    <rect x="820" y="172" width="80" height="6" fill="#ecf0f1" stroke="#333" stroke-width="1"/>
    <rect x="820" y="172" width="32" height="6" fill="#e74c3c"/>

    <text x="820" y="195">Procesamiento: 35%</text>
    <rect x="820" y="197" width="80" height="6" fill="#ecf0f1" stroke="#333" stroke-width="1"/>
    <rect x="820" y="197" width="28" height="6" fill="#f39c12"/>

    <text x="820" y="220">Fabricación: 20%</text>
    <rect x="820" y="222" width="80" height="6" fill="#ecf0f1" stroke="#333" stroke-width="1"/>
    <rect x="820" y="222" width="16" height="6" fill="#3498db"/>

    <text x="820" y="245">Distribución: 5%</text>
    <rect x="820" y="247" width="80" height="6" fill="#ecf0f1" stroke="#333" stroke-width="1"/>
    <rect x="820" y="247" width="4" height="6" fill="#9b59b6"/>
  </g>

  <!-- Bottom note -->
  <rect x="30" y="460" width="940" height="35" fill="#e8f4f8" stroke="#3498db" stroke-width="1" rx="3"/>
  <text x="500" y="482" text-anchor="middle" class="phase-label" font-size="11">
    La economía circular busca minimizar residuos: EXTRACCIÓN → PROCESAMIENTO → FABRICACIÓN → DISTRIBUCIÓN → USO → RECICLAJE
  </text>
</svg>