<svg viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .step-box { fill: #E3F2FD; stroke: #1976D2; stroke-width: 2; }
      .step-title { font-size: 14px; font-weight: bold; fill: #1976D2; }
      .step-desc { font-size: 11px; fill: #424242; }
      .arrow { fill: none; stroke: #666; stroke-width: 2; marker-end: url(#arrowhead); }
      .cycle-indicator { fill: #F3E5F5; stroke: #7B1FA2; stroke-width: 2; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#666"/>
    </marker>
  </defs>

  <text x="500" y="35" style="font-size: 22px; font-weight: bold; text-anchor: middle;">El Proceso Tecnológico</text>
  <text x="500" y="55" style="font-size: 13px; fill: #666; text-anchor: middle;">Los 7 pasos para resolver un problema</text>

  <!-- Row 1 -->
  <g id="step-1">
    <rect class="step-box" x="40" y="80" width="130" height="100" rx="5"/>
    <text class="step-title" x="105" y="105" style="text-anchor: middle">1. Detectar</text>
    <text class="step-desc" x="50" y="120">la necesidad:</text>
    <text class="step-desc" x="50" y="135">qué falta</text>
    <text class="step-desc" x="50" y="150">y a quién</text>
    <text class="step-desc" x="50" y="165">le falta</text>
  </g>

  <path class="arrow" d="M 170 130 L 220 130"/>

  <g id="step-2">
    <rect class="step-box" x="220" y="80" width="130" height="100" rx="5"/>
    <text class="step-title" x="285" y="105" style="text-anchor: middle">2. Analizar</text>
    <text class="step-desc" x="230" y="120">el problema:</text>
    <text class="step-desc" x="230" y="135">qué tiene que</text>
    <text class="step-desc" x="230" y="150">cumplir</text>
    <text class="step-desc" x="230" y="165">(requisitos)</text>
  </g>

  <path class="arrow" d="M 350 130 L 400 130"/>

  <g id="step-3">
    <rect class="step-box" x="400" y="80" width="130" height="100" rx="5"/>
    <text class="step-title" x="465" y="105" style="text-anchor: middle; font-size: 12px">3. Buscar ideas</text>
    <text class="step-desc" x="410" y="120">varias, no una:</text>
    <text class="step-desc" x="410" y="135">cuantas más,</text>
    <text class="step-desc" x="410" y="150">mejor la</text>
    <text class="step-desc" x="410" y="165">elegida</text>
  </g>

  <path class="arrow" d="M 530 130 L 580 130"/>

  <g id="step-4">
    <rect class="step-box" x="580" y="80" width="130" height="100" rx="5"/>
    <text class="step-title" x="645" y="105" style="text-anchor: middle; font-size: 12px">4. Elegir y diseñar</text>
    <text class="step-desc" x="590" y="120">con un criterio;</text>
    <text class="step-desc" x="590" y="135">medidas,</text>
    <text class="step-desc" x="590" y="150">materiales,</text>
    <text class="step-desc" x="590" y="165">piezas, dibujos</text>
  </g>

  <path class="arrow" d="M 710 130 L 760 130"/>

  <g id="step-5">
    <rect class="step-box" x="760" y="80" width="130" height="100" rx="5"/>
    <text class="step-title" x="825" y="105" style="text-anchor: middle">5. Planificar</text>
    <text class="step-desc" x="770" y="120">quién hace qué,</text>
    <text class="step-desc" x="770" y="135">con qué y en</text>
    <text class="step-desc" x="770" y="150">cuánto tiempo</text>
    <text class="step-desc" x="770" y="165">(Gantt)</text>
  </g>

  <!-- Row 2 arrows: del 5 al 6 -->
  <path class="arrow" d="M 825 180 L 825 200 L 285 200 L 285 218"/>

  <!-- Row 3 -->
  <g id="step-6">
    <rect class="step-box" x="220" y="220" width="130" height="100" rx="5"/>
    <text class="step-title" x="285" y="245" style="text-anchor: middle">6. Construir</text>
    <text class="step-desc" x="230" y="260">siguiendo</text>
    <text class="step-desc" x="230" y="275">el plan:</text>
    <text class="step-desc" x="230" y="290">herramientas,</text>
    <text class="step-desc" x="230" y="305">técnicas</text>
  </g>

  <path class="arrow" d="M 350 270 L 400 270"/>

  <g id="step-7">
    <rect class="step-box" x="400" y="220" width="130" height="100" rx="5"/>
    <text class="step-title" x="465" y="245" style="text-anchor: middle">7. Evaluar</text>
    <text class="step-desc" x="410" y="260">¿Cumple los</text>
    <text class="step-desc" x="410" y="275">requisitos</text>
    <text class="step-desc" x="410" y="290">del paso 2?</text>
    <text class="step-desc" x="410" y="305">Si no, atrás</text>
  </g>

  <!-- Vuelta atras: del 7 (evaluar) al 4 (elegir y disenar) -->
  <path class="arrow" d="M 530 270 L 645 270 L 645 182" stroke="#7B1FA2" stroke-width="2.5" fill="none" marker-end="url(#arrowhead-purple)"/>
  <text x="560" y="262" style="font-size: 11px; fill: #7B1FA2; font-weight: bold;">si no cumple</text>

  <marker id="arrowhead-purple" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
    <polygon points="0 0, 10 3, 0 6" fill="#7B1FA2"/>
  </marker>

  <!-- Bottom notes -->
  <rect x="40" y="480" width="880" height="100" fill="#FFF9C4" stroke="#F57F17" stroke-width="1" rx="3"/>
  <text x="490" y="505" style="font-size: 13px; font-weight: bold; text-anchor: middle; fill: #F57F17;">Características del Proceso Tecnológico</text>
  <text x="50" y="530" style="font-size: 11px; fill: #333;">• No es una línea recta: si al evaluar no cumple, se vuelve atrás, casi siempre al diseño</text>
  <text x="50" y="550" style="font-size: 11px; fill: #333;">• Resuelve problemas reales: desde una necesidad hasta un producto funcional</text>
  <text x="50" y="570" style="font-size: 11px; fill: #333;">• Requiere planificación: tiempo, recursos, materiales y herramientas</text>
</svg>