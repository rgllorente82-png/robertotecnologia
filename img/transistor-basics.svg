<svg viewBox="-67 -33.4 1170.7 667.5" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font-family: Arial, sans-serif; font-size: 14px; font-weight: bold; text-anchor: middle; }
      .label { font-family: Arial, sans-serif; font-size: 12px; text-anchor: middle; }
      .box { stroke: #2c3e50; stroke-width: 2; }
      .wire { stroke: #333; stroke-width: 1.5; fill: none; }
      .good { stroke: #27ae60; stroke-width: 2; }
      .bad { stroke: #e74c3c; stroke-width: 2; }
      .mono { font-family: 'Courier New', monospace; font-size: 11px; }
    </style>
  </defs>

  <!-- Background -->
  <rect x="-50" y="-16" width="1128" height="633" fill="#f8f9fa"/>

  <!-- Title -->
  <text style="font-size: 18" x="500" y="30" class="title">El Transistor: El Componente que Revolucionó el Mundo</text>

  <!-- LEFT: Transistor as a switch -->
  <g>
    <text style="font-size: 13; font-weight: bold" x="250" y="70" class="title">TRANSISTOR COMO INTERRUPTOR</text>

    <!-- Control pin (base) -->
    <g>
      <text style="font-size: 10" x="100" y="115" class="label" font-weight="bold" fill="#666">Control (Base)</text>
      <circle cx="150" cy="130" r="4" fill="#f39c12"/>
      <line x1="150" y1="134" x2="150" y2="160" class="wire"/>
    </g>

    <!-- Circuit 1: No control voltage -->
    <g>
      <rect x="80" y="170" width="140" height="80" fill="#fff3cd" stroke="#f39c12" stroke-width="1"/>
      <text style="font-size: 11" x="150" y="190" class="label" font-weight="bold">Sin control (0V)</text>

      <!-- Battery -->
      <rect x="110" y="210" width="15" height="30" fill="white" stroke="#2c3e50" stroke-width="1.5"/>
      <line x1="112" y1="210" x2="112" y2="200" stroke="#e74c3c" stroke-width="2"/>
      <line x1="123" y1="210" x2="123" y2="200" stroke="#333" stroke-width="1"/>

      <!-- Transistor symbol (simplified) -->
      <circle cx="150" cy="225" r="8" fill="none" stroke="#2c3e50" stroke-width="2"/>
      <text style="font-size: 9" x="150" y="230" class="label">T</text>

      <!-- LED -->
      <circle cx="110" cy="225" r="6" fill="#ffff00" stroke="#f39c12" stroke-width="2" opacity="0.3"/>

      <text style="font-size: 10" x="150" y="260" class="label" font-weight="bold" fill="#e74c3c">LED APAGADO</text>
    </g>

    <!-- Circuit 2: With control voltage -->
    <g>
      <rect x="80" y="290" width="140" height="80" fill="#d4edda" stroke="#27ae60" stroke-width="1"/>
      <text style="font-size: 11" x="150" y="310" class="label" font-weight="bold">Con control (5V)</text>

      <!-- Battery -->
      <rect x="110" y="330" width="15" height="30" fill="white" stroke="#2c3e50" stroke-width="1.5"/>
      <line x1="112" y1="330" x2="112" y2="320" stroke="#e74c3c" stroke-width="2"/>
      <line x1="123" y1="330" x2="123" y2="320" stroke="#333" stroke-width="1"/>

      <!-- Transistor symbol -->
      <circle cx="150" cy="345" r="8" fill="none" stroke="#2c3e50" stroke-width="2"/>
      <text style="font-size: 9" x="150" y="350" class="label">T</text>

      <!-- LED -->
      <circle cx="110" cy="345" r="6" fill="#ffff00" stroke="#f39c12" stroke-width="2"/>

      <text style="font-size: 10" x="150" y="380" class="label" font-weight="bold" fill="#27ae60">LED ENCENDIDO</text>
    </g>
  </g>

  <!-- RIGHT: Practical applications -->
  <g>
    <text style="font-size: 13; font-weight: bold" x="750" y="70" class="title">APLICACIONES PRÁCTICAS</text>

    <!-- Application 1: Digital logic -->
    <g>
      <rect x="650" y="110" width="300" height="95" fill="#e8f4f8" stroke="#3498db" stroke-width="1" rx="3"/>
      <text style="text-anchor: start; font-size: 11" x="670" y="135" class="label" font-weight="bold" fill="#2c3e50">🔌 Lógica Digital (CPU)</text>

      <g font-family="Arial" font-size="10" fill="#2c3e50" text-anchor="start">
        <text x="670" y="158">• Transistores como 1 (ON) y 0 (OFF)</text>
        <text x="670" y="175">• Un procesador moderno: 10 mil millones</text>
        <text x="670" y="192">• Todos controlados por voltajes digitales</text>
      </g>
    </g>

    <!-- Application 2: Amplification -->
    <g>
      <rect x="650" y="220" width="300" height="95" fill="#e8f4f8" stroke="#3498db" stroke-width="1" rx="3"/>
      <text style="text-anchor: start; font-size: 11" x="670" y="245" class="label" font-weight="bold" fill="#2c3e50">📻 Amplificación de Señal</text>

      <g font-family="Arial" font-size="10" fill="#2c3e50" text-anchor="start">
        <text x="670" y="268">• Una pequeña señal controla corriente grande</text>
        <text x="670" y="285">• Entrada: 1 mA → Salida: 100 mA (ganancia 100×)</text>
        <text x="670" y="302">• Radios, equipos de audio, amplificadores</text>
      </g>
    </g>

    <!-- Application 3: Power control -->
    <g>
      <rect x="650" y="330" width="300" height="95" fill="#e8f4f8" stroke="#3498db" stroke-width="1" rx="3"/>
      <text style="text-anchor: start; font-size: 11" x="670" y="355" class="label" font-weight="bold" fill="#2c3e50">⚡ Control de Potencia</text>

      <g font-family="Arial" font-size="10" fill="#2c3e50" text-anchor="start">
        <text x="670" y="378">• Arduino controla un motor (voltaje bajo → alto)</text>
        <text x="670" y="395">• Relé controlado por transistor</text>
        <text x="670" y="412">• Es cómo los microcontroladores gobiernan cargas</text>
      </g>
    </g>
  </g>

  <!-- BOTTOM: The History and Impact -->
  <g>
    <rect x="40" y="450" width="920" height="130" fill="#fff3cd" stroke="#f39c12" stroke-width="2" rx="5"/>

    <text style="text-anchor: start; font-size: 12" x="60" y="475" class="label" font-weight="bold" fill="#e74c3c">¿Por qué revolucionó el mundo?</text>

    <g font-family="Arial" font-size="10.5" fill="#2c3e50" text-anchor="start">
      <text x="60" y="502"><tspan font-weight="bold">Antes (1950):</tspan> Válvulas de vacío: enormes, calientes, rotas fácilmente. Un ordenador pesaba toneladas y ocupaba una habitación.</text>

      <text x="60" y="523"><tspan font-weight="bold">Transistor (1947):</tspan> Pequeño, frío, duradero, bajo consumo. Permitió miniaturización exponencial: Ley de Moore.</text>

      <text x="60" y="544"><tspan font-weight="bold">Hoy:</tspan> 100 mil millones de transistores en un smartphone. Consumo de miliwatios para hacer mil millones de operaciones por segundo. Este componente, inventado en 1947, es la razón por la que tienes tecnología portátil.</text>

      <text x="60" y="565"><tspan font-weight="bold">Futuro:</tspan> Llegamos a 3 nanómetros. Los siguiente es tecnología cuántica o óptica. Pero el transistor clásico va a seguir siendo la base durante décadas.</text>
    </g>
  </g>

</svg>