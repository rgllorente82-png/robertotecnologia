<svg viewBox="0 0 1000 700" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font-family: Arial, sans-serif; font-size: 16px; font-weight: bold; text-anchor: middle; }
      .label { font-family: Arial, sans-serif; font-size: 12px; }
      .code { font-family: 'Courier New', monospace; font-size: 10px; }
    </style>
    <marker id="arrowyellow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#f39c12"/>
    </marker>
    <marker id="arrowgreen" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1000" height="700" fill="#f8f9fa"/>

  <!-- Title -->
  <text x="500" y="35" class="title" font-size="18">HTTP vs HTTPS: qué protege el candado</text>
  <text x="500" y="55" class="label" font-size="11" fill="#666" text-anchor="middle">Por qué algunos sitios tienen candado y otros no, y qué significa para tus datos</text>

  <!-- LEFT: HTTP (NO SECURITY) -->
  <g>
    <text x="220" y="95" class="title" font-size="13">HTTP: sin cifrado</text>
    <text x="220" y="115" class="label" font-size="10" text-anchor="middle" fill="#e74c3c" font-weight="bold">⚠ PELIGRO: datos visibles</text>

    <!-- You - Computer -->
    <circle cx="120" cy="160" r="25" fill="#e8f4f8" stroke="#3498db" stroke-width="1.5"/>
    <text x="120" y="165" class="label" font-size="14" text-anchor="middle">💻</text>
    <text x="120" y="195" class="label" font-size="9" text-anchor="middle">Tu ordenador</text>

    <!-- Arrow with visible data -->
    <path d="M 145 160 L 250 160" stroke="#f39c12" stroke-width="3" fill="none" marker-end="url(#arrowyellow)"/>
    <text x="195" y="150" class="code" text-anchor="middle" font-weight="bold">usuario=ana</text>
    <text x="195" y="165" class="code" text-anchor="middle" font-weight="bold">contraseña=abc123</text>

    <!-- Server -->
    <circle cx="320" cy="160" r="25" fill="#fbbc04" stroke="#d68910" stroke-width="1.5"/>
    <text x="320" y="165" class="label" font-size="14" text-anchor="middle">🖥️</text>
    <text x="320" y="195" class="label" font-size="9" text-anchor="middle">Servidor web</text>

    <!-- Hacker intercepts -->
    <g>
      <circle cx="195" cy="230" r="30" fill="none" stroke="#e74c3c" stroke-width="2" stroke-dasharray="5,3"/>
      <text x="195" y="235" class="label" font-size="13" text-anchor="middle" fill="#e74c3c">🚨</text>
      <text x="195" y="260" class="label" font-size="10" text-anchor="middle" fill="#e74c3c" font-weight="bold">Hacker ve TODO</text>
    </g>

    <!-- Problem box -->
    <rect x="50" y="310" width="340" height="120" fill="#fef8e8" stroke="#f39c12" stroke-width="1.5" rx="3"/>
    <text x="220" y="335" class="label" font-size="11" text-anchor="middle" font-weight="bold">El problema:</text>
    <g font-family="Arial" font-size="9.5" fill="#2c3e50" text-anchor="start">
      <text x="70" y="360">✗ Datos viajan en texto limpio (sin cifrar)</text>
      <text x="70" y="378">✗ Cualquiera en el camino (red pública) puede verlos</text>
      <text x="70" y="396">✗ Contraseñas, números de tarjeta, todo: expuesto</text>
      <text x="70" y="414">✗ En redes Wi-Fi públicas es trivial interceptar</text>
    </g>
  </g>

  <!-- RIGHT: HTTPS (WITH SECURITY) -->
  <g>
    <text x="780" y="95" class="title" font-size="13">HTTPS: con cifrado</text>
    <text x="780" y="115" class="label" font-size="10" text-anchor="middle" fill="#27ae60" font-weight="bold">🔒 SEGURO: datos cifrados</text>

    <!-- You - Computer -->
    <circle cx="680" cy="160" r="25" fill="#e8f8e8" stroke="#27ae60" stroke-width="1.5"/>
    <text x="680" y="165" class="label" font-size="14" text-anchor="middle">💻</text>
    <text x="680" y="195" class="label" font-size="9" text-anchor="middle">Tu ordenador</text>

    <!-- Arrow with encrypted data -->
    <path d="M 705 160 L 810 160" stroke="#27ae60" stroke-width="3" fill="none" marker-end="url(#arrowgreen)"/>
    <text x="755" y="150" class="code" text-anchor="middle" font-weight="bold">🔐 KhD9%jFk</text>
    <text x="755" y="165" class="code" text-anchor="middle" font-weight="bold">mL2$pQw8Xz</text>
    <text x="755" y="180" class="label" font-size="8" text-anchor="middle" fill="#27ae60">cifrado</text>

    <!-- Server -->
    <circle cx="880" cy="160" r="25" fill="#f0fef0" stroke="#27ae60" stroke-width="1.5"/>
    <text x="880" y="165" class="label" font-size="14" text-anchor="middle">🖥️</text>
    <text x="880" y="195" class="label" font-size="9" text-anchor="middle">Servidor web</text>

    <!-- Padlock -->
    <g>
      <circle cx="755" cy="230" r="30" fill="none" stroke="#27ae60" stroke-width="2"/>
      <text x="755" y="238" class="label" font-size="24" text-anchor="middle" fill="#27ae60">🔒</text>
      <text x="755" y="260" class="label" font-size="10" text-anchor="middle" fill="#27ae60" font-weight="bold">El candado protege</text>
    </g>

    <!-- Solution box -->
    <rect x="610" y="310" width="340" height="120" fill="#f0fef0" stroke="#27ae60" stroke-width="1.5" rx="3"/>
    <text x="780" y="335" class="label" font-size="11" text-anchor="middle" font-weight="bold">La solución:</text>
    <g font-family="Arial" font-size="9.5" fill="#2c3e50" text-anchor="start">
      <text x="630" y="360">✓ Datos cifrados: nadie los puede leer</text>
      <text x="630" y="378">✓ Certificado SSL: verifica que es el servidor real</text>
      <text x="630" y="396">✓ Incluso en Wi-Fi público es seguro</text>
      <text x="630" y="414">✓ Contraseñas y datos sensibles protegidos</text>
    </g>
  </g>

  <!-- BOTTOM: How to spot and understand -->
  <g>
    <rect x="30" y="470" width="940" height="210" fill="white" stroke="#2c3e50" stroke-width="1.5" rx="3"/>

    <text x="500" y="500" class="title" font-size="13">Cómo reconocerlo y qué significa</text>

    <g font-family="Arial" font-size="10" fill="#2c3e50" text-anchor="start">
      <text x="60" y="530"><b>En el navegador:</b></text>
      <text x="80" y="548">• Mira la barra de direcciones (URL):</text>
      <text x="100" y="565"><code class="code">http://ejemplo.com</code> = SIN cifrado (peligroso con datos sensibles)</text>
      <text x="100" y="583"><code class="code">https://ejemplo.com</code> con candado 🔒 = CON cifrado (seguro)</text>

      <text x="60" y="610"><b>¿Cuándo es obligatorio HTTPS?</b></text>
      <text x="80" y="628">✓ Siempre que escribas contraseña (email, redes sociales)</text>
      <text x="80" y="646">✓ Sitios bancarios y tiendas online (donde pones tarjeta)</text>
      <text x="80" y="664">✗ Blogs de noticias o páginas informativas: menos crítico, pero preferible</text>
    </g>

    <!-- Important note -->
    <rect x="520" y="530" width="420" height="130" fill="#f0fef0" stroke="#27ae60" stroke-width="1.5" rx="3"/>
    <text x="730" y="555" class="label" font-size="11" text-anchor="middle" font-weight="bold" fill="#188038">⚠️ IMPORTANTE:</text>
    <g font-family="Arial" font-size="9.5" fill="#2c3e50" text-anchor="start">
      <text x="540" y="580">El HTTPS protege que nadie vea lo que envías.</text>
      <text x="540" y="598">Pero <b>NO</b> protege frente a:</text>
      <text x="560" y="616">• Phishing (sitios falsos que parecen reales)</text>
      <text x="560" y="634">• Virus si descargas archivos peligrosos</text>
      <text x="560" y="652">• Tu contraseña si es fácil (123456, password...)</text>
    </g>
  </g>

</svg>