<svg viewBox="0 0 1000 700" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font-family: Arial, sans-serif; font-size: 16px; font-weight: bold; text-anchor: middle; }
      .label { font-family: Arial, sans-serif; font-size: 12px; }
      .mono { font-family: 'Courier New', monospace; font-size: 11px; }
    </style>
    <marker id="arrowblue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#3498db"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1000" height="700" fill="#f8f9fa"/>

  <!-- Title -->
  <text x="500" y="35" class="title" font-size="18">Máquina de Estados</text>
  <text x="500" y="55" class="label" font-size="11" fill="#666" text-anchor="middle">Cómo piensa un robot: estados y transiciones</text>

  <!-- LEFT: Simple example -->
  <g>
    <text x="100" y="85" class="title" font-size="13">Ejemplo: Semáforo</text>

    <!-- State circles -->
    <!-- ROJO -->
    <circle cx="100" cy="160" r="35" fill="#ea4335" stroke="#c0392b" stroke-width="3"/>
    <text x="100" y="168" class="label" font-size="12" text-anchor="middle" fill="#fff" font-weight="bold">ROJO</text>

    <!-- AMARILLO -->
    <circle cx="240" cy="160" r="35" fill="#fbbc04" stroke="#d68910" stroke-width="2"/>
    <text x="240" y="168" class="label" font-size="12" text-anchor="middle">AMARILLO</text>

    <!-- VERDE -->
    <circle cx="100" cy="270" r="35" fill="#34a853" stroke="#229954" stroke-width="2"/>
    <text x="100" y="278" class="label" font-size="12" text-anchor="middle" fill="#fff" font-weight="bold">VERDE</text>

    <!-- Arrows/transitions -->
    <!-- ROJO -> VERDE -->
    <path d="M 130 185 Q 140 230 130 245" stroke="#3498db" stroke-width="2.5" fill="none" marker-end="url(#arrowblue)"/>
    <text x="155" y="215" class="label" font-size="10" fill="#3498db" font-weight="bold">30 seg</text>

    <!-- VERDE -> AMARILLO -->
    <path d="M 130 245 Q 160 160 200 160" stroke="#3498db" stroke-width="2.5" fill="none" marker-end="url(#arrowblue)"/>
    <text x="160" y="155" class="label" font-size="10" fill="#3498db">5 seg</text>

    <!-- AMARILLO -> ROJO -->
    <path d="M 210 145 Q 155 120 135 140" stroke="#3498db" stroke-width="2.5" fill="none" marker-end="url(#arrowblue)"/>
    <text x="155" y="120" class="label" font-size="10" fill="#3498db">3 seg</text>

    <text x="100" y="335" class="label" font-size="10" text-anchor="middle">Cada estado tiene</text>
    <text x="100" y="350" class="label" font-size="10" text-anchor="middle">duración y condición</text>
    <text x="100" y="365" class="label" font-size="10" text-anchor="middle">para pasar al siguiente</text>
  </g>

  <!-- RIGHT: Robot vacuum example -->
  <g>
    <text x="500" y="85" class="title" font-size="13">Ejemplo: Roomba (aspiradora robot)</text>

    <!-- State boxes (vertical layout) -->
    <!-- IDLE -->
    <rect x="420" y="120" width="160" height="60" fill="#e8f4f8" stroke="#3498db" stroke-width="2" rx="3"/>
    <text x="500" y="140" class="label" font-size="11" text-anchor="middle" font-weight="bold">ESPERA</text>
    <text x="500" y="155" class="label" font-size="9" text-anchor="middle">(batería cargada, esperando orden)</text>

    <!-- EXPLORING -->
    <rect x="420" y="210" width="160" height="60" fill="#e8f8e8" stroke="#27ae60" stroke-width="2" rx="3"/>
    <text x="500" y="230" class="label" font-size="11" text-anchor="middle" font-weight="bold">EXPLORANDO</text>
    <text x="500" y="245" class="label" font-size="9" text-anchor="middle">(moviéndose, limpiando)</text>

    <!-- OBSTACLE -->
    <rect x="420" y="300" width="160" height="60" fill="#fff8e8" stroke="#f39c12" stroke-width="2" rx="3"/>
    <text x="500" y="320" class="label" font-size="11" text-anchor="middle" font-weight="bold">OBSTÁCULO</text>
    <text x="500" y="335" class="label" font-size="9" text-anchor="middle">(rodeando, girando)</text>

    <!-- CHARGING -->
    <rect x="420" y="390" width="160" height="60" fill="#f8e8f8" stroke="#9b59b6" stroke-width="2" rx="3"/>
    <text x="500" y="410" class="label" font-size="11" text-anchor="middle" font-weight="bold">CARGANDO</text>
    <text x="500" y="425" class="label" font-size="9" text-anchor="middle">(volvió a base, en carga)</text>

    <!-- Transitions -->
    <!-- ESPERA -> EXPLORANDO -->
    <path d="M 500 180 L 500 210" stroke="#3498db" stroke-width="2" fill="none" marker-end="url(#arrowblue)"/>
    <text x="515" y="198" class="label" font-size="9" fill="#3498db">botón START</text>

    <!-- EXPLORANDO -> OBSTÁCULO -->
    <path d="M 500 270 L 500 300" stroke="#3498db" stroke-width="2" fill="none" marker-end="url(#arrowblue)"/>
    <text x="515" y="288" class="label" font-size="9" fill="#3498db">sensor toca</text>

    <!-- OBSTÁCULO -> EXPLORANDO -->
    <path d="M 420 330 Q 350 315 380 240" stroke="#3498db" stroke-width="2" fill="none" marker-end="url(#arrowblue)"/>
    <text x="330" y="280" class="label" font-size="9" fill="#3498db">libre</text>

    <!-- EXPLORANDO -> CHARGING -->
    <path d="M 500 270 L 500 390" stroke="#3498db" stroke-width="2" fill="none" marker-end="url(#arrowblue)" stroke-dasharray="5,3"/>
    <text x="500" y="306" class="label" style="font-size: 9px; text-anchor: middle" fill="#3498db">batería baja</text>

    <!-- CHARGING -> ESPERA -->
    <path d="M 580 420 Q 680 270 580 150" stroke="#3498db" stroke-width="2" fill="none" marker-end="url(#arrowblue)"/>
    <text x="680" y="290" class="label" font-size="9" fill="#3498db">100%</text>
  </g>

  <!-- BOTTOM: Key concept -->
  <g>
    <rect x="30" y="480" width="940" height="200" fill="white" stroke="#2c3e50" stroke-width="1.5" rx="3"/>

    <text x="500" y="510" class="title" font-size="13">¿Cómo funciona?</text>

    <g font-family="Arial" font-size="11" fill="#2c3e50" text-anchor="start">
      <text x="60" y="540"><tspan font-weight="bold">1. Estados:</tspan> Cada estado representa una <tspan font-weight="bold">situación</tspan> de la máquina.</text>
      <text x="80" y="560">   Ejemplo: La Roomba está limpiando, ha encontrado un obstáculo, está cargando, etc.</text>

      <text x="60" y="590"><tspan font-weight="bold">2. Transiciones:</tspan> Cambios de un estado a otro basados en <tspan font-weight="bold">eventos o sensores</tspan>.</text>
      <text x="80" y="610">   Ejemplo: Si la batería baja → pasa de EXPLORANDO a CARGANDO. Si encuentra pared → gira.</text>

      <text x="60" y="640"><tspan font-weight="bold">3. Acciones:</tspan> En cada estado, la máquina <tspan font-weight="bold">hace algo específico</tspan>.</text>
      <text x="80" y="660">   Ejemplo: En EXPLORANDO activa el cepillo. En CARGANDO lo apaga.</text>

      <text x="500" y="692" class="label" font-size="10" text-anchor="middle" fill="#3498db" font-weight="bold">
        ← Esta es la base del programa de un robot →
      </text>
    </g>
  </g>

</svg>
