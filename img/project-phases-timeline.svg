<svg viewBox="0 0 1000 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .phase-bar { stroke: #2c3e50; stroke-width: 2; fill-opacity: 0.9; }
      .title { font-family: Arial, sans-serif; font-size: 14px; font-weight: bold; text-anchor: middle; }
      .label { font-family: Arial, sans-serif; font-size: 12px; text-anchor: middle; }
      .phase-label { font-family: Arial, sans-serif; font-size: 11px; text-anchor: middle; }
      .timeline { stroke: #2c3e50; stroke-width: 2; }
      .arrow { stroke: #3498db; stroke-width: 2; fill: none; marker-end: url(#arrowright); }
    </style>
    <marker id="arrowright" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#3498db"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1000" height="500" fill="#f8f9fa"/>

  <!-- Title -->
  <text x="500" y="35" class="title" font-size="18">Fases de un Proyecto Tecnológico</text>

  <!-- Timeline axis -->
  <line x1="50" y1="120" x2="950" y2="120" class="timeline"/>

  <!-- Phase 1: Planificación -->
  <g>
    <rect x="50" y="150" width="130" height="100" class="phase-bar" fill="#e74c3c"/>
    <text x="115" y="180" class="title" fill="white" font-size="12">PLANIFICACIÓN</text>
    <text x="115" y="200" class="phase-label" fill="white">Semana 1</text>
    <text x="115" y="217" class="phase-label" fill="white">10-15%</text>

    <!-- Details -->
    <rect x="50" y="270" width="130" height="90" fill="#ffe8e8" stroke="#e74c3c" stroke-width="1" rx="3"/>
    <g font-family="Arial" font-size="9" fill="#2c3e50" text-anchor="start">
      <text x="60" y="290">✓ Definir objetivo</text>
      <text x="60" y="305">✓ Listar requisitos</text>
      <text x="60" y="320">✓ Estimar tiempo</text>
      <text x="60" y="335">✓ Asignar recursos</text>
      <text x="60" y="350">✓ Hacer diagrama</text>
    </g>

    <!-- Arrow to next -->
    <path d="M185,115 L210,115" class="arrow"/>
  </g>

  <!-- Phase 2: Diseño -->
  <g>
    <rect x="210" y="150" width="130" height="100" class="phase-bar" fill="#f39c12"/>
    <text x="275" y="180" class="title" fill="white" font-size="12">DISEÑO</text>
    <text x="275" y="200" class="phase-label" fill="white">Semanas 2-3</text>
    <text x="275" y="217" class="phase-label" fill="white">15-20%</text>

    <!-- Details -->
    <rect x="210" y="270" width="130" height="90" fill="#fff3cd" stroke="#f39c12" stroke-width="1" rx="3"/>
    <g font-family="Arial" font-size="9" fill="#2c3e50" text-anchor="start">
      <text x="220" y="290">✓ Dibujos técnicos</text>
      <text x="220" y="305">✓ Cálculos</text>
      <text x="220" y="320">✓ Materiales</text>
      <text x="220" y="335">✓ Herramientas</text>
      <text x="220" y="350">✓ CAD (opcional)</text>
    </g>

    <!-- Arrow to next -->
    <path d="M345,115 L370,115" class="arrow"/>
  </g>

  <!-- Phase 3: Construcción -->
  <g>
    <rect x="370" y="150" width="130" height="100" class="phase-bar" fill="#3498db"/>
    <text x="435" y="180" class="title" fill="white" font-size="12">CONSTRUCCIÓN</text>
    <text x="435" y="200" class="phase-label" fill="white">Semanas 4-6</text>
    <text x="435" y="217" class="phase-label" fill="white">50-60%</text>

    <!-- Details -->
    <rect x="370" y="270" width="130" height="90" fill="#d1ecf1" stroke="#3498db" stroke-width="1" rx="3"/>
    <g font-family="Arial" font-size="9" fill="#2c3e50" text-anchor="start">
      <text x="380" y="290">✓ Cortar piezas</text>
      <text x="380" y="305">✓ Montar componentes</text>
      <text x="380" y="320">✓ Pruebas parciales</text>
      <text x="380" y="335">✓ Solucionar fallos</text>
      <text x="380" y="350">✓ Acabados</text>
    </g>

    <!-- Arrow to next -->
    <path d="M505,115 L530,115" class="arrow"/>
  </g>

  <!-- Phase 4: Pruebas -->
  <g>
    <rect x="530" y="150" width="130" height="100" class="phase-bar" fill="#27ae60"/>
    <text x="595" y="180" class="title" fill="white" font-size="12">PRUEBAS</text>
    <text x="595" y="200" class="phase-label" fill="white">Semana 7</text>
    <text x="595" y="217" class="phase-label" fill="white">10-15%</text>

    <!-- Details -->
    <rect x="530" y="270" width="130" height="90" fill="#d4edda" stroke="#27ae60" stroke-width="1" rx="3"/>
    <g font-family="Arial" font-size="9" fill="#2c3e50" text-anchor="start">
      <text x="540" y="290">✓ ¿Funciona?</text>
      <text x="540" y="305">✓ Usar bajo stress</text>
      <text x="540" y="320">✓ Medir resultados</text>
      <text x="540" y="335">✓ Corregir errores</text>
      <text x="540" y="350">✓ Documento final</text>
    </g>

    <!-- Arrow to next -->
    <path d="M665,115 L690,115" class="arrow"/>
  </g>

  <!-- Phase 5: Presentación -->
  <g>
    <rect x="690" y="150" width="130" height="100" class="phase-bar" fill="#9b59b6"/>
    <text x="755" y="180" class="title" fill="white" font-size="12">PRESENTACIÓN</text>
    <text x="755" y="200" class="phase-label" fill="white">Semana 8</text>
    <text x="755" y="217" class="phase-label" fill="white">5-10%</text>

    <!-- Details -->
    <rect x="690" y="270" width="130" height="90" fill="#e2d5f3" stroke="#9b59b6" stroke-width="1" rx="3"/>
    <g font-family="Arial" font-size="9" fill="#2c3e50" text-anchor="start">
      <text x="700" y="290">✓ Demostración en vivo</text>
      <text x="700" y="305">✓ Presentación oral</text>
      <text x="700" y="320">✓ Evaluación de pares</text>
      <text x="700" y="335">✓ Preguntas</text>
      <text x="700" y="350">✓ Reflexión aprendizaje</text>
    </g>
  </g>

  <!-- Bottom: Critical path -->
  <rect x="50" y="410" width="900" height="70" fill="#e8f4f8" stroke="#3498db" stroke-width="1" rx="5"/>
  <text x="60" y="435" class="title" font-size="11" text-anchor="start" font-weight="bold">Ruta crítica: Lo que más importa</text>
  <text x="60" y="455" class="label" font-size="10" text-anchor="start">Construcción es la fase más larga (50-60%). Cualquier retraso ahí retrasa todo el proyecto.</text>
  <text x="60" y="470" class="label" font-size="10" text-anchor="start">Por eso: asigna más tiempo, más personas, y planifica contingencias para construcción.</text>
</svg>