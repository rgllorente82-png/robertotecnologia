<svg viewBox="0 0 1000 700" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font-family: Arial, sans-serif; font-size: 16px; font-weight: bold; text-anchor: middle; }
      .label { font-family: Arial, sans-serif; font-size: 12px; }
      .code { font-family: 'Courier New', monospace; font-size: 10px; }
    </style>
    <marker id="arrowblue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#3498db"/>
    </marker>
    <marker id="arrowyellow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#f39c12"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1000" height="700" fill="#f8f9fa"/>

  <!-- Title -->
  <text x="500" y="35" class="title" font-size="18">Un problema no es una idea</text>
  <text x="500" y="55" class="label" font-size="11" fill="#666" text-anchor="middle">La diferencia entre problema y solución</text>

  <!-- LEFT: PROBLEM -->
  <g>
    <rect x="30" y="90" width="430" height="280" fill="#fff8e8" stroke="#e74c3c" stroke-width="2" rx="4"/>
    
    <text x="245" y="120" class="title" font-size="13">PROBLEMA</text>
    <text x="245" y="138" class="label" font-size="10" fill="#e74c3c" text-anchor="middle" font-weight="bold">Lo que está mal, lo que falta</text>

    <!-- Example -->
    <g transform="translate(245, 170)">
      <circle cx="0" cy="0" r="40" fill="none" stroke="#e74c3c" stroke-width="2"/>
      <line x1="-30" y1="-30" x2="30" y2="30" stroke="#e74c3c" stroke-width="3"/>
      <line x1="30" y1="-30" x2="-30" y2="30" stroke="#e74c3c" stroke-width="3"/>
      <text x="0" y="65" class="label" font-size="10" text-anchor="middle" fill="#e74c3c">&#10005; Error</text>
    </g>

    <!-- Characteristics -->
    <g font-family="Arial" font-size="9" fill="#2c3e50" text-anchor="start">
      <text x="60" y="280">✓ Describe un estado actual</text>
      <text x="60" y="298">✓ Responde a "¿qué va mal?"</text>
      <text x="60" y="316">✓ Neutral: sin opción preferida</text>
      <text x="60" y="334">Ejemplo: "Es difícil riego manual"</text>
    </g>
  </g>

  <!-- Arrow between -->
  <g>
    <path d="M 490 240 L 540 240" stroke="#3498db" stroke-width="2.5" fill="none" marker-end="url(#arrowblue)"/>
    <text x="515" y="228" class="label" font-size="10" fill="#3498db" font-weight="bold" text-anchor="middle">¿Cómo lo</text>
    <text x="515" y="242" class="label" font-size="10" fill="#3498db" font-weight="bold" text-anchor="middle">arreglamos?</text>
  </g>

  <!-- RIGHT: SOLUTION -->
  <g>
    <rect x="540" y="90" width="430" height="280" fill="#f0fef0" stroke="#27ae60" stroke-width="2" rx="4"/>
    
    <text x="755" y="120" class="title" font-size="13">SOLUCIÓN</text>
    <text x="755" y="138" class="label" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="bold">Una forma de arreglarlo</text>

    <!-- Example -->
    <g transform="translate(755, 170)">
      <circle cx="0" cy="0" r="40" fill="none" stroke="#27ae60" stroke-width="2"/>
      <circle cx="0" cy="0" r="30" fill="none" stroke="#27ae60" stroke-width="1.5"/>
      <path d="M -20 0 L 20 0 M 0 -20 L 0 20" stroke="#27ae60" stroke-width="2"/>
      <text x="0" y="65" class="label" font-size="10" text-anchor="middle" fill="#27ae60">✓ Correcto</text>
    </g>

    <!-- Characteristics -->
    <g font-family="Arial" font-size="9" fill="#2c3e50" text-anchor="start">
      <text x="570" y="280">✓ Describe una acción o cambio</text>
      <text x="570" y="298">✓ Responde a "¿qué hacemos?"</text>
      <text x="570" y="316">✓ Preferida: UNA idea, NO todas</text>
      <text x="570" y="334">Ejemplo: "Sistema automático"</text>
    </g>
  </g>

  <!-- BOTTOM: THE ERROR -->
  <g>
    <rect x="30" y="410" width="940" height="280" fill="white" stroke="#2c3e50" stroke-width="1.5" rx="3"/>

    <text x="500" y="440" class="title" font-size="13">El error más común</text>

    <!-- Left side: ERROR -->
    <g>
      <rect x="50" y="460" width="400" height="200" fill="#fef8e8" stroke="#f39c12" stroke-width="1.5" rx="3"/>
      
      <text x="250" y="485" class="label" font-size="11" text-anchor="middle" font-weight="bold" fill="#e74c3c">❌ PROBLEMA DISFRAZADO DE IDEA</text>
      
      <g font-family="Arial" font-size="10" fill="#2c3e50" text-anchor="start">
        <text x="70" y="515">Lo que escriben:</text>
        <text x="90" y="535" class="code" fill="#e74c3c">Los niños duermen poco</text>
        <text x="90" y="555" class="code" fill="#e74c3c">No hay riego en la escuela</text>
        <text x="90" y="575" class="code" fill="#e74c3c">Contamina mucho</text>
        <text x="90" y="595" class="code" fill="#e74c3c">Es muy caro</text>
        
        <text x="70" y="625" font-weight="bold">Problema:</text>
        <text x="90" y="642">Sin criterios no tienes cómo elegir</text>
      </g>
    </g>

    <!-- Right side: CORRECT -->
    <g>
      <rect x="500" y="460" width="440" height="200" fill="#f0f0f0" stroke="#27ae60" stroke-width="1.5" rx="3"/>
      
      <text x="720" y="485" class="label" font-size="11" text-anchor="middle" font-weight="bold" fill="#27ae60">✓ PROBLEMA BIEN ESCRITO</text>
      
      <g font-family="Arial" font-size="10" fill="#2c3e50" text-anchor="start">
        <text x="520" y="515">Lo que escriben:</text>
        <text x="540" y="535" class="code" fill="#27ae60">El riego manual cuesta 200h/año</text>
        <text x="540" y="555" class="code" fill="#27ae60">El sistema debe costar &lt;300€</text>
        <text x="540" y="575" class="code" fill="#27ae60">Ocupar más de 1m² no entra</text>
        <text x="540" y="595" class="code" fill="#27ae60">Funcionar sin mantenimiento</text>
        
        <text x="520" y="625" font-weight="bold">Ventaja:</text>
        <text x="540" y="642">Puedes medir, comparar y elegir</text>
      </g>
    </g>
  </g>

</svg>
