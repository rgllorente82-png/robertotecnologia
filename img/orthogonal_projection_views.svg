<svg viewBox="0 0 1000 700" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .view-label { font-size: 14px; font-weight: bold; fill: #1976D2; }
      .dimension-line { stroke: #E91E63; stroke-width: 1; fill: none; }
      .dimension-text { font-size: 10px; fill: #E91E63; text-anchor: middle; }
    </style>
  </defs>

  <text x="500" y="35" style="font-size: 22px; font-weight: bold; text-anchor: middle;">Las Tres Vistas - Sistema Europeo</text>
  <text x="500" y="55" style="font-size: 13px; fill: #666; text-anchor: middle;">Representación técnica de un objeto en dos dimensiones</text>

  <!-- 3D reference object -->
  <g id="3d-box">
    <text x="750" y="78" style="font-size: 12px; font-weight: bold; fill: #1976D2;">Objeto 3D</text>
    <!-- Front face -->
    <rect x="700" y="112" width="80" height="57" fill="#E3F2FD" stroke="#1976D2" stroke-width="2"/>
    <!-- cara lateral: profundidad a 45º, media medida -->
    <polygon points="780,112 801,91 801,148 780,169" fill="#B3E5FC" stroke="#1976D2" stroke-width="2"/>
    <!-- cara superior: los mismos 45º, y sin cruzar -->
    <polygon points="700,112 721,91 801,91 780,112" fill="#81D4FA" stroke="#1976D2" stroke-width="2"/>
  </g>

  <!-- ALZADO (Front View) -->
  <g id="alzado">
    <text x="150" y="95" class="view-label">ALZADO (vista frontal)</text>
    <text x="150" y="115" style="font-size: 11px; fill: #666;">Lo que se ve desde el frente</text>

    <!-- Box drawing -->
    <rect x="80" y="130" width="140" height="100" fill="#E3F2FD" stroke="#1976D2" stroke-width="2"/>

    <!-- Details -->
    <circle cx="95" cy="145" r="3" fill="#1976D2"/>
    <circle cx="205" cy="145" r="3" fill="#1976D2"/>
    <line x1="95" y1="145" x2="205" y2="145" class="dimension-line" stroke-dasharray="2,2"/>
    <text x="150" y="155" class="dimension-text">Ancho (A)</text>

    <circle cx="80" cy="145" r="3" fill="#1976D2"/>
    <circle cx="80" cy="230" r="3" fill="#1976D2"/>
    <line x1="80" y1="145" x2="80" y2="230" class="dimension-line" stroke-dasharray="2,2"/>
    <text x="65" y="190" class="dimension-text" style="text-anchor: end;">Alto (H)</text>
  </g>

  <!-- PLANTA (Top View) -->
  <g id="planta">
    <text x="150" y="290" class="view-label">PLANTA (vista desde arriba)</text>
    <text x="150" y="310" style="font-size: 11px; fill: #666;">Lo que se ve desde arriba</text>

    <!-- Box drawing -->
    <rect x="80" y="325" width="140" height="75" fill="#C8E6C9" stroke="#388E3C" stroke-width="2"/>

    <!-- Details -->
    <circle cx="95" cy="337" r="3" fill="#388E3C"/>
    <circle cx="205" cy="337" r="3" fill="#388E3C"/>
    <line x1="95" y1="337" x2="205" y2="337" class="dimension-line" stroke-dasharray="2,2" stroke="#4CAF50"/>
    <text x="150" y="347" style="font-size: 10px; fill: #4CAF50; text-anchor: middle;">Ancho (A)</text>

    <circle cx="80" cy="337" r="3" fill="#388E3C"/>
    <circle cx="80" cy="400" r="3" fill="#388E3C"/>
    <line x1="80" y1="337" x2="80" y2="400" class="dimension-line" stroke-dasharray="2,2" stroke="#4CAF50"/>
    <text x="65" y="370" style="font-size: 10px; fill: #4CAF50; text-anchor: end;">Profundidad (P)</text>
  </g>

  <!-- PERFIL (Side View) -->
  <g id="perfil">
    <text x="150" y="485" class="view-label">PERFIL (vista lateral)</text>
    <text x="150" y="505" style="font-size: 11px; fill: #666;">Lo que se ve desde el lado</text>

    <!-- Box drawing -->
    <rect x="80" y="520" width="75" height="100" fill="#FFF9C4" stroke="#F57F17" stroke-width="2"/>

    <!-- Details -->
    <circle cx="95" cy="532" r="3" fill="#F57F17"/>
    <circle cx="150" cy="532" r="3" fill="#F57F17"/>
    <line x1="95" y1="532" x2="150" y2="532" class="dimension-line" stroke-dasharray="2,2" stroke="#FBC02D"/>
    <text x="118" y="542" style="font-size: 10px; fill: #FBC02D; text-anchor: middle;">Profundidad (P)</text>

    <circle cx="80" cy="532" r="3" fill="#F57F17"/>
    <circle cx="80" cy="620" r="3" fill="#F57F17"/>
    <line x1="80" y1="532" x2="80" y2="620" class="dimension-line" stroke-dasharray="2,2" stroke="#FBC02D"/>
    <text x="65" y="577" style="font-size: 10px; fill: #FBC02D; text-anchor: end;">Alto (H)</text>
  </g>

  <!-- Layout diagram on the right -->
  <g id="layout">
    <text x="500" y="200" style="font-size: 12px; font-weight: bold; fill: #1976D2;">Disposición en el plano de dibujo</text>

    <!-- Grid background -->
    <rect x="420" y="220" width="380" height="200" fill="#F5F5F5" stroke="#DDD" stroke-width="1" rx="3"/>

    <!-- Planta at top -->
    <rect x="430" y="230" width="80" height="50" fill="#C8E6C9" stroke="#388E3C" stroke-width="1.5"/>
    <text x="470" y="270" style="font-size: 10px; text-anchor: middle; fill: #388E3C; font-weight: bold;">PLANTA</text>

    <!-- Alzado at bottom left -->
    <rect x="430" y="330" width="80" height="70" fill="#E3F2FD" stroke="#1976D2" stroke-width="1.5"/>
    <text x="470" y="375" style="font-size: 10px; text-anchor: middle; fill: #1976D2; font-weight: bold;">ALZADO</text>

    <!-- Perfil at bottom right -->
    <rect x="650" y="330" width="50" height="70" fill="#FFF9C4" stroke="#F57F17" stroke-width="1.5"/>
    <text x="675" y="375" style="font-size: 10px; text-anchor: middle; fill: #F57F17; font-weight: bold;">PERFIL</text>

    <!-- Alignment lines -->
    <line x1="510" y1="280" x2="510" y2="330" stroke="#999" stroke-width="0.5" stroke-dasharray="1,1"/>
    <line x1="470" y1="300" x2="650" y2="300" stroke="#999" stroke-width="0.5" stroke-dasharray="1,1"/>
    <line x1="710" y1="300" x2="710" y2="330" stroke="#999" stroke-width="0.5" stroke-dasharray="1,1"/>
  </g>

  <!-- Key information box -->
  <rect x="420" y="450" width="380" height="180" fill="#F3E5F5" stroke="#7B1FA2" stroke-width="1" rx="3"/>
  <text x="610" y="475" style="font-size: 13px; font-weight: bold; text-anchor: middle; fill: #7B1FA2;">Puntos clave</text>

  <text x="430" y="500" style="font-size: 11px; fill: #333;">• ALZADO: dimensiones Ancho × Alto</text>
  <text x="430" y="520" style="font-size: 11px; fill: #333;">• PLANTA: dimensiones Ancho × Profundidad</text>
  <text x="430" y="540" style="font-size: 11px; fill: #333;">• PERFIL: dimensiones Profundidad × Alto</text>
  <text x="430" y="560" style="font-size: 11px; fill: #333;">• Las líneas de alineación vinculan las vistas</text>
  <text x="430" y="580" style="font-size: 11px; fill: #333;">• Cada dimensión (A, P, H) aparece en dos vistas</text>
  <text x="430" y="600" style="font-size: 11px; fill: #333;">• Este sistema es el estándar europeo (ISO)</text>
  <text x="430" y="620" style="font-size: 11px; fill: #333;">• Con las tres vistas se reconstruye la pieza exacta</text>
</svg>