<svg viewBox="-314.9 -19.4 1334.4 638.9" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .box { stroke: #2c3e50; stroke-width: 2; fill-opacity: 0.9; }
      .title { font-family: Arial, sans-serif; font-size: 14px; font-weight: bold; text-anchor: middle; }
      .label { font-family: Arial, sans-serif; font-size: 12px; text-anchor: middle; }
      .arrow { stroke: #3498db; stroke-width: 2; fill: none; marker-end: url(#arrowright); }
      .data-flow { stroke: #e74c3c; stroke-width: 2; fill: none; marker-end: url(#arrowred); stroke-dasharray: 5,5; }
    </style>
    <marker id="arrowright" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#3498db"/>
    </marker>
    <marker id="arrowred" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#e74c3c"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="-315" y="-19" width="1334" height="639" fill="#f8f9fa"/>

  <!-- Title -->
  <text x="500" y="35" class="title" font-size="18">Arquitectura del Ordenador</text>

  <!-- Left: Input Peripherals -->
  <g>
    <rect x="30" y="100" width="120" height="100" class="box" fill="#e74c3c"/>
    <text x="90" y="135" class="title" fill="white">ENTRADA</text>
    <text x="90" y="155" class="label" fill="white">Teclado</text>
    <text x="90" y="170" class="label" fill="white">Ratón</text>
    <text x="90" y="185" class="label" fill="white">Sensor</text>

    <!-- Arrow to CPU -->
    <path d="M150,150 L220,150" class="data-flow"/>
  </g>

  <!-- Center Top: CPU (Processor) -->
  <rect x="220" y="80" width="140" height="70" class="box" fill="#3498db"/>
  <text x="290" y="110" class="title" fill="white">CPU</text>
  <text x="290" y="130" class="label" fill="white">Procesador</text>

  <!-- Center: RAM Memory -->
  <rect x="220" y="200" width="140" height="80" class="box" fill="#f39c12"/>
  <text x="290" y="235" class="title" fill="white">MEMORIA RAM</text>
  <text x="290" y="255" class="label" fill="white">Rápida, volátil</text>
  <text x="290" y="270" class="label" fill="white">(Trabajo actual)</text>

  <!-- Arrow CPU to RAM (bidirectional) -->
  <path d="M290,150 L290,200" class="arrow"/>
  <path d="M290,200 L290,150" class="arrow"/>

  <!-- Right: Storage -->
  <rect x="500" y="140" width="140" height="140" class="box" fill="#27ae60"/>
  <text x="570" y="180" class="title" fill="white">ALMACENAMIENTO</text>
  <text x="570" y="200" class="label" fill="white">Disco duro</text>
  <text x="570" y="215" class="label" fill="white">SSD</text>
  <text x="570" y="230" class="label" fill="white">USB</text>
  <text x="570" y="245" class="label" fill="white">Lento, persistente</text>

  <!-- Arrow RAM to Storage (bidirectional) -->
  <path d="M360,240 L500,240" class="arrow"/>
  <path d="M500,220 L360,200" class="arrow"/>

  <!-- Right: Output Peripherals -->
  <g>
    <rect x="820" y="100" width="140" height="100" class="box" fill="#9b59b6"/>
    <text x="890" y="135" class="title" fill="white">SALIDA</text>
    <text x="890" y="155" class="label" fill="white">Pantalla</text>
    <text x="890" y="170" class="label" fill="white">Altavoz</text>
    <text x="890" y="185" class="label" fill="white">Red</text>

    <!-- Arrow from CPU to Output -->
    <path d="M360,120 L820,150" class="data-flow"/>
  </g>

  <!-- Bottom: Bus de Datos -->
  <g>
    <rect x="30" y="340" width="930" height="50" fill="#ecf0f1" stroke="#3498db" stroke-width="2" rx="5"/>
    <text x="500" y="365" class="label" font-weight="bold">BUS DE DATOS: Carreteras por las que viajan números entre CPU, RAM y Almacenamiento</text>
  </g>

  <!-- Bottom section: Memory hierarchy -->
  <g>
    <text x="50" y="435" class="title" font-size="13">Jerarquía de velocidad:</text>

    <!-- L1 Cache -->
    <rect x="50" y="450" width="100" height="60" fill="#e8f4f8" stroke="#3498db" stroke-width="1" rx="3"/>
    <text x="100" y="475" class="label" font-weight="bold">L1 Cache</text>
    <text x="100" y="495" class="label" font-size="10">Ultrarrápida</text>
    <text x="100" y="510" class="label" font-size="10">~1 ns</text>

    <!-- RAM -->
    <rect x="180" y="450" width="100" height="60" fill="#fff3cd" stroke="#f39c12" stroke-width="1" rx="3"/>
    <text x="230" y="475" class="label" font-weight="bold">RAM</text>
    <text x="230" y="495" class="label" font-size="10">Rápida</text>
    <text x="230" y="510" class="label" font-size="10">~80 ns</text>

    <!-- Disk -->
    <rect x="310" y="450" width="100" height="60" fill="#d4edda" stroke="#27ae60" stroke-width="1" rx="3"/>
    <text x="360" y="475" class="label" font-weight="bold">Disco</text>
    <text x="360" y="495" class="label" font-size="10">Lenta</text>
    <text x="360" y="510" class="label" font-size="10">~10 ms</text>
  </g>

  <!-- Flow description -->
  <rect x="30" y="530" width="940" height="50" fill="#e8f4f8" stroke="#3498db" stroke-width="1" rx="4"/>
  <text x="50" y="555" class="label" font-size="11" text-anchor="start" font-weight="bold">Flujo de datos:</text>
  <text x="50" y="572" class="label" font-size="10" text-anchor="start">Entrada → CPU procesa → Resultado en RAM → Salida. Todo el proceso usa el Bus para transferir números entre componentes.</text>
</svg>