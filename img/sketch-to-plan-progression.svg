<svg viewBox="0 0 1000 590" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="La misma pieza dibujada tres veces: como boceto a mano alzada sin medidas, como croquis a mano con cotas aproximadas y como plano a escala con cotas, vistas y cajetín">
  <defs>
    <marker id="cota" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#c0392b"/>
    </marker>
    <marker id="cotaini" markerWidth="8" markerHeight="8" refX="1" refY="3" orient="auto">
      <path d="M7,0 L0,3 L7,6 z" fill="#c0392b"/>
    </marker>
    <marker id="paso" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#5a6472"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="590" fill="#f8f9fa"/>

  <text x="500" y="38" style="font-family: Arial, sans-serif; font-size: 19px; font-weight: bold; text-anchor: middle; fill: #1f2733">La misma pieza, tres veces</text>
  <text x="500" y="60" style="font-family: Arial, sans-serif; font-size: 13px; text-anchor: middle; fill: #5a6472">Del garabato que sirve para pensar al documento con el que se fabrica</text>

  <!-- ============================ BOCETO ============================ -->
  <g>
    <rect x="34" y="86" width="290" height="360" rx="6" fill="#fff8ee" stroke="#e08b1e" stroke-width="2"/>
    <text x="179" y="116" style="font-family: Arial, sans-serif; font-size: 16px; font-weight: bold; text-anchor: middle; fill: #b46c0a">BOCETO</text>
    <text x="179" y="136" style="font-family: Arial, sans-serif; font-size: 11.5px; text-anchor: middle; fill: #8a6a31">a mano alzada, sin medir</text>

    <!-- pieza en L, trazo suelto: cada lado con dos pasadas -->
    <g fill="none" stroke="#b46c0a" stroke-width="2.4" stroke-linecap="round">
      <path d="M92 300 L92 186 L96 184"/>
      <path d="M90 302 L196 302 L194 298"/>
      <path d="M94 184 L206 186"/>
      <path d="M204 186 L206 244 L202 246"/>
      <path d="M204 245 L268 243"/>
      <path d="M266 243 L268 302 L264 300"/>
      <path d="M266 303 L196 301"/>
      <circle cx="132" cy="226" r="15"/>
      <circle cx="130" cy="228" r="13"/>
    </g>
    <text x="179" y="338" style="font-family: Arial, sans-serif; font-size: 11px; text-anchor: middle; fill: #8a6a31">sin cotas, sin escuadra, sin escala</text>

    <g style="font-family: Arial, sans-serif; font-size: 11.5px; fill: #3a4351">
      <text x="56" y="366">Sirve para <tspan font-weight="bold">pensar</tspan> y comparar ideas.</text>
      <text x="56" y="386">Se hace en segundos, encima de</text>
      <text x="56" y="403">cualquier papel. Y no se borra:</text>
      <text x="56" y="420">si sale torcida, otra línea al lado.</text>
    </g>
  </g>

  <path d="M334 250 L354 250" stroke="#5a6472" stroke-width="2.5" fill="none" marker-end="url(#paso)"/>

  <!-- ============================ CROQUIS ============================ -->
  <g>
    <rect x="355" y="86" width="290" height="360" rx="6" fill="#eef6fd" stroke="#2f6feb" stroke-width="2"/>
    <text x="500" y="116" style="font-family: Arial, sans-serif; font-size: 16px; font-weight: bold; text-anchor: middle; fill: #1c5fa8">CROQUIS</text>
    <text x="500" y="136" style="font-family: Arial, sans-serif; font-size: 11.5px; text-anchor: middle; fill: #2f6feb">a pulso tambi&#233;n, pero con las medidas puestas</text>

    <g fill="none" stroke="#1c5fa8" stroke-width="2.4" stroke-linecap="round">
      <path d="M412 301 C 411 260, 414 220, 413 187"/>
      <path d="M412 187 C 450 184, 492 189, 528 186"/>
      <path d="M527 187 C 528 207, 525 228, 527 246"/>
      <path d="M526 245 C 546 247, 570 243, 590 245"/>
      <path d="M589 246 C 590 265, 587 284, 589 301"/>
      <path d="M590 300 C 540 303, 470 298, 412 301"/>
      <path d="M441 224 C 443 214, 453 210, 463 215 C 470 221, 468 234, 459 238 C 449 241, 440 234, 441 224"/>
    </g>
    <!-- cotas a pulso: lo que convierte un boceto en croquis -->
    <g stroke="#c0392b" stroke-width="1.3" fill="none" stroke-linecap="round">
      <path d="M414 323 C 470 321, 540 325, 588 322" marker-end="url(#cota)" marker-start="url(#cotaini)"/>
      <path d="M413 307 L414 327 M589 308 L588 326"/>
      <path d="M604 188 C 602 220, 606 268, 603 299" marker-end="url(#cota)" marker-start="url(#cotaini)"/>
      <path d="M594 187 L610 185 M594 301 L610 299"/>
    </g>
    <text x="501" y="317" style="font-family: Arial, sans-serif; font-size: 11px; text-anchor: middle; fill: #c0392b">120</text>
    <text x="619" y="247" style="font-family: Arial, sans-serif; font-size: 11px; fill: #c0392b">80</text>

    <g style="font-family: Arial, sans-serif; font-size: 11.5px; fill: #3a4351">
      <text x="377" y="366">Sirve para <tspan font-weight="bold">tomar datos</tspan> de una pieza</text>
      <text x="377" y="386">que tienes delante. Las proporciones</text>
      <text x="377" y="403">se cuidan y las medidas son reales,</text>
      <text x="377" y="420">pero el trazo sigue siendo a pulso.</text>
    </g>
  </g>

  <path d="M655 250 L675 250" stroke="#5a6472" stroke-width="2.5" fill="none" marker-end="url(#paso)"/>

  <!-- ============================= PLANO ============================= -->
  <g>
    <rect x="676" y="86" width="290" height="360" rx="6" fill="#eef9f1" stroke="#2fa84f" stroke-width="2"/>
    <text x="821" y="116" style="font-family: Arial, sans-serif; font-size: 16px; font-weight: bold; text-anchor: middle; fill: #1d7a38">PLANO</text>
    <text x="821" y="136" style="font-family: Arial, sans-serif; font-size: 11.5px; text-anchor: middle; fill: #2fa84f">con instrumentos y a escala</text>

    <g fill="none" stroke="#1d7a38" stroke-width="2.2" stroke-linejoin="miter">
      <path d="M718 292 L718 178 L832 178 L832 237 L894 237 L894 292 Z"/>
      <circle cx="758" cy="218" r="14"/>
    </g>
    <!-- ejes del agujero -->
    <g stroke="#1d7a38" stroke-width="0.9" stroke-dasharray="7 3 2 3">
      <path d="M736 218 L780 218 M758 196 L758 240" fill="none"/>
    </g>
    <!-- cotas con línea auxiliar, como en un plano -->
    <g stroke="#c0392b" stroke-width="1.1" fill="none">
      <path d="M718 312 L894 312" marker-end="url(#cota)" marker-start="url(#cotaini)"/>
      <path d="M718 296 L718 318 M894 296 L894 318"/>
      <path d="M908 178 L908 292" marker-end="url(#cota)" marker-start="url(#cotaini)"/>
      <path d="M898 178 L914 178 M898 292 L914 292"/>
    </g>
    <text x="806" y="307" style="font-family: Arial, sans-serif; font-size: 10.5px; text-anchor: middle; fill: #c0392b">120 ±0,2</text>
    <text x="918" y="238" style="font-family: Arial, sans-serif; font-size: 10.5px; fill: #c0392b">80</text>
    <!-- cajetín -->
    <g>
      <rect x="718" y="326" width="176" height="24" fill="#ffffff" stroke="#1d7a38" stroke-width="1.2"/>
      <path d="M800 326 L800 350" stroke="#1d7a38" stroke-width="1.2" fill="none"/>
      <text x="726" y="342" style="font-family: Arial, sans-serif; font-size: 9.5px; fill: #1d7a38">Soporte en L</text>
      <text x="808" y="342" style="font-family: Arial, sans-serif; font-size: 9.5px; fill: #1d7a38">Escala 1:2</text>
    </g>

    <g style="font-family: Arial, sans-serif; font-size: 11.5px; fill: #3a4351">
      <text x="698" y="374">Sirve para <tspan font-weight="bold">fabricar</tspan>. Lleva escala,</text>
      <text x="698" y="394">tolerancias y cajetín, y sigue las</text>
      <text x="698" y="411">normas: con él, la pieza sale igual</text>
      <text x="698" y="428">en este taller y en otro cualquiera.</text>
    </g>
  </g>

  <!-- ============================ CIERRE ============================= -->
  <rect x="34" y="482" width="932" height="76" rx="6" fill="#ffffff" stroke="#d6dce5" stroke-width="1.5"/>
  <text x="56" y="508" style="font-family: Arial, sans-serif; font-size: 12.5px; font-weight: bold; fill: #1f2733">Lo que cambia de uno a otro no es la habilidad de dibujar: es qué información lleva dentro.</text>
  <text x="56" y="530" style="font-family: Arial, sans-serif; font-size: 11.5px; fill: #3a4351">El boceto lleva una idea. El croquis, además, las medidas. El plano, además, la escala, las tolerancias y quién responde de él.</text>
  <text x="56" y="548" style="font-family: Arial, sans-serif; font-size: 11.5px; fill: #3a4351">Por eso un boceto se enseña, un croquis se usa en el taller y un plano se firma.</text>
</svg>
