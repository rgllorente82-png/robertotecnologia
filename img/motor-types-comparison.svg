<svg viewBox="0 0 1000 700" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font-family: Arial, sans-serif; font-size: 16px; font-weight: bold; text-anchor: middle; }
      .label { font-family: Arial, sans-serif; font-size: 12px; }
      .box { stroke: #2c3e50; stroke-width: 2; }
      .arrow { stroke: #e74c3c; stroke-width: 2; fill: none; marker-end: url(#arrowred); }
    </style>
    <marker id="arrowred" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#e74c3c"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1000" height="700" fill="#f8f9fa"/>

  <!-- Title -->
  <text x="500" y="35" class="title" font-size="18">Tipos de Motores</text>
  <text x="500" y="55" class="label" font-size="11" fill="#666" text-anchor="middle">DC, servo y paso a paso: usos y diferencias</text>

  <!-- MOTOR DC -->
  <g>
    <rect x="30" y="80" width="300" height="280" fill="#e8f4f8" stroke="#3498db" stroke-width="2" rx="5"/>
    <text x="180" y="110" class="title" font-size="13">Motor DC (Corriente Continua)</text>

    <!-- Visual: spinning circle -->
    <circle cx="180" cy="155" r="30" fill="#e74c3c" stroke="#c0392b" stroke-width="2" opacity="0.3"/>
    <circle cx="180" cy="155" r="25" fill="none" stroke="#c0392b" stroke-width="3"/>
    <path d="M180 130 L180 155" stroke="#c0392b" stroke-width="2" fill="none"/>

    <text x="180" y="200" class="label" font-size="10" text-anchor="middle" font-weight="bold">Gira rápido</text>
    <text x="180" y="215" class="label" font-size="10" text-anchor="middle">cualquier posición</text>

    <g font-family="Arial" font-size="10" fill="#2c3e50" text-anchor="start">
      <text x="50" y="245"><tspan font-weight="bold">Uso:</tspan> Movimiento continuo</text>
      <text x="50" y="260">• Ruedas de robot</text>
      <text x="50" y="275">• Ventiladores, taladros</text>
      <text x="50" y="290">• Cualquier cosa que gire rápido</text>

      <text x="50" y="315"><tspan font-weight="bold">Coste: Barato</tspan></text>
      <text x="50" y="330">No sabe dónde está: solo gira</text>
    </g>
  </g>

  <!-- SERVO MOTOR -->
  <g>
    <rect x="350" y="80" width="300" height="280" fill="#e8f8e8" stroke="#27ae60" stroke-width="2" rx="5"/>
    <text x="500" y="110" class="title" font-size="13">Servo Motor</text>

    <!-- Visual: limited rotation with angle indicator -->
    <circle cx="500" cy="155" r="30" fill="#27ae60" stroke="#229954" stroke-width="2" opacity="0.3"/>
    <path d="M500 130 L500 130 Q510 140 515 155" stroke="#229954" stroke-width="3" fill="none"/>
    <path d="M500 155 L530 155" stroke="#27ae60" stroke-width="2" stroke-dasharray="5,3" opacity="0.5" fill="none"/>

    <text x="500" y="200" class="label" font-size="10" text-anchor="middle" font-weight="bold">0° a 180°</text>
    <text x="500" y="215" class="label" font-size="10" text-anchor="middle">(posición exacta)</text>

    <g font-family="Arial" font-size="10" fill="#2c3e50" text-anchor="start">
      <text x="370" y="245"><tspan font-weight="bold">Uso:</tspan> Posición controlada</text>
      <text x="370" y="260">• Brazo robótico (articulaciones)</text>
      <text x="370" y="275">• Control de dirección (timón)</text>
      <text x="370" y="290">• Cualquier cosa que pare en un ángulo</text>

      <text x="370" y="315"><tspan font-weight="bold">Coste: Medio</tspan></text>
      <text x="370" y="330">Sabe exactamente dónde está</text>
    </g>
  </g>

  <!-- STEPPER MOTOR -->
  <g>
    <rect x="670" y="80" width="300" height="280" fill="#fff8e8" stroke="#f39c12" stroke-width="2" rx="5"/>
    <text x="820" y="110" class="title" font-size="13">Motor Paso a Paso (Stepper)</text>

    <!-- Visual: step indicators -->
    <circle cx="800" cy="155" r="8" fill="#f39c12" stroke="#d68910" stroke-width="1.5"/>
    <circle cx="820" cy="155" r="8" fill="#f39c12" stroke="#d68910" stroke-width="1.5"/>
    <circle cx="840" cy="155" r="8" fill="#f39c12" stroke="#d68910" stroke-width="1.5"/>
    <path d="M785 155 L855 155" stroke="#d68910" stroke-width="1" stroke-dasharray="3,2" fill="none"/>

    <text x="820" y="200" class="label" font-size="10" text-anchor="middle" font-weight="bold">Pasos precisos</text>
    <text x="820" y="215" class="label" font-size="10" text-anchor="middle">rotación suave</text>

    <g font-family="Arial" font-size="10" fill="#2c3e50" text-anchor="start">
      <text x="690" y="245"><tspan font-weight="bold">Uso:</tspan> Precisión paso a paso</text>
      <text x="690" y="260">• Impresoras 3D (eje X, Y, Z)</text>
      <text x="690" y="275">• Máquinas CNC</text>
      <text x="690" y="290">• Cualquier máquina que necesite</text>
      <text x="690" y="305">exactitud y pasos pequeños</text>

      <text x="690" y="330"><tspan font-weight="bold">Coste: Caro</tspan></text>
    </g>
  </g>

  <!-- COMPARISON TABLE -->
  <g>
    <rect x="30" y="380" width="940" height="300" fill="white" stroke="#2c3e50" stroke-width="1.5" rx="3"/>

    <text x="500" y="410" class="title" font-size="13" text-anchor="middle">Comparación</text>

    <!-- Table headers -->
    <line x1="50" y1="430" x2="970" y2="430" stroke="#dadce0" stroke-width="1"/>
    <text x="150" y="425" class="label" font-size="11" font-weight="bold" text-anchor="middle">DC</text>
    <text x="400" y="425" class="label" font-size="11" font-weight="bold" text-anchor="middle">SERVO</text>
    <text x="650" y="425" class="label" font-size="11" font-weight="bold" text-anchor="middle">STEPPER</text>

    <!-- Row 1: Speed -->
    <line x1="50" y1="445" x2="970" y2="445" stroke="#dadce0" stroke-width="1"/>
    <text x="50" y="442" class="label" font-size="10" font-weight="bold">Velocidad</text>
    <text x="150" y="442" class="label" font-size="10">Muy rápido</text>
    <text x="400" y="442" class="label" font-size="10">Rápido</text>
    <text x="650" y="442" class="label" font-size="10">Lento</text>

    <!-- Row 2: Precision -->
    <line x1="50" y1="460" x2="970" y2="460" stroke="#dadce0" stroke-width="1"/>
    <text x="50" y="457" class="label" font-size="10" font-weight="bold">Precisión</text>
    <text x="150" y="457" class="label" font-size="10">Baja (no sabe dónde está)</text>
    <text x="400" y="457" class="label" font-size="10">Alta (ángulo exacto)</text>
    <text x="650" y="457" class="label" font-size="10">Muy alta (pasos)</text>

    <!-- Row 3: Control -->
    <line x1="50" y1="475" x2="970" y2="475" stroke="#dadce0" stroke-width="1"/>
    <text x="50" y="472" class="label" font-size="10" font-weight="bold">Control</text>
    <text x="150" y="472" class="label" font-size="10">Voltaje simple</text>
    <text x="400" y="472" class="label" font-size="10">PWM + feedback</text>
    <text x="650" y="472" class="label" font-size="10">Pulsos precisos</text>

    <!-- Row 4: Cost -->
    <line x1="50" y1="490" x2="970" y2="490" stroke="#dadce0" stroke-width="1"/>
    <text x="50" y="487" class="label" font-size="10" font-weight="bold">Coste</text>
    <text x="150" y="487" class="label" font-size="10">€</text>
    <text x="400" y="487" class="label" font-size="10">€€</text>
    <text x="650" y="487" class="label" font-size="10">€€€</text>

    <!-- Row 5: Torque -->
    <line x1="50" y1="505" x2="970" y2="505" stroke="#dadce0" stroke-width="1"/>
    <text x="50" y="502" class="label" font-size="10" font-weight="bold">Fuerza (Torque)</text>
    <text x="150" y="502" class="label" font-size="10">Media-Alta</text>
    <text x="400" y="502" class="label" font-size="10">Media</text>
    <text x="650" y="502" class="label" font-size="10">Alta</text>

    <!-- Row 6: Use case -->
    <line x1="50" y1="520" x2="970" y2="520" stroke="#dadce0" stroke-width="1"/>
    <text x="50" y="517" class="label" font-size="10" font-weight="bold">Cuándo usar</text>
    <text x="150" y="517" class="label" font-size="9">Movimiento rápido,</text>
    <text x="150" y="530" class="label" style="font-size: 9px">sin importar exactitud</text>
    <text x="400" y="517" class="label" font-size="9">Posición exacta,</text>
    <text x="400" y="530" class="label" style="font-size: 9px">rango limitado (0-180°)</text>
    <text x="650" y="517" class="label" font-size="9">Precisión extrema,</text>
    <text x="650" y="530" class="label" style="font-size: 9px">muchos pasos</text>

    <!-- Key insight -->
    <text x="500" y="560" class="label" font-size="11" text-anchor="middle" font-weight="bold" fill="#e74c3c">
      La elección depende: ¿velocidad, posición exacta o precisión en pasos?
    </text>

    <text x="50" y="590" class="label" font-size="10">Consejo:</text>
    <text x="50" y="605" class="label" font-size="10">• Ruedas de robot → Motor DC</text>
    <text x="50" y="620" class="label" font-size="10">• Brazo robótico (articulación) → Servo</text>
    <text x="50" y="635" class="label" font-size="10">• Impresora 3D (ejes de movimiento) → Stepper</text>
  </g>

</svg>
