<svg viewBox="0 0 1000 700" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font-family: Arial, sans-serif; font-size: 16px; font-weight: bold; text-anchor: middle; }
      .label { font-family: Arial, sans-serif; font-size: 12px; text-anchor: middle; }
      .box { stroke: #2c3e50; stroke-width: 2; }
      .good { fill: #d4edda; stroke: #27ae60; }
      .bad { fill: #f8d7da; stroke: #e74c3c; }
      .neutral { fill: #e8f4f8; stroke: #3498db; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1000" height="700" fill="#f8f9fa"/>

  <!-- Title -->
  <text x="500" y="35" class="title" font-size="18">Propiedades de los Materiales</text>
  <text x="500" y="55" class="label" font-size="11" fill="#666">Cómo elegir el material correcto para cada trabajo</text>

  <!-- MECHANICAL PROPERTIES -->
  <g>
    <rect x="30" y="80" width="300" height="240" class="neutral" rx="5"/>
    <text x="180" y="105" class="label" font-size="13" font-weight="bold">Propiedades Mecánicas</text>

    <g font-family="Arial" font-size="11" fill="#2c3e50" text-anchor="start">
      <text x="50" y="140"><b>Resistencia:</b> Aguanta sin romper</text>
      <text x="70" y="157">Acero > Aluminio > Plástico</text>

      <text x="50" y="185"><b>Rigidez (Dureza):</b> No se deforma</text>
      <text x="70" y="202">Vidrio > Acero > Goma</text>

      <text x="50" y="230"><b>Tenacidad:</b> Absorbe golpes</text>
      <text x="70" y="247">Goma > Acero > Vidrio</text>

      <text x="50" y="275"><b>Elasticidad:</b> Vuelve a su forma</text>
      <text x="70" y="292">Goma > Madera > Acero (poco)</text>
    </g>
  </g>

  <!-- THERMAL PROPERTIES -->
  <g>
    <rect x="350" y="80" width="300" height="240" class="neutral" rx="5"/>
    <text x="500" y="105" class="label" font-size="13" font-weight="bold">Propiedades Térmicas</text>

    <g font-family="Arial" font-size="11" fill="#2c3e50" text-anchor="start">
      <text x="370" y="140"><b>Conductividad térmica:</b></text>
      <text x="390" y="157">Aluminio > Hierro > Madera > Plástico</text>

      <text x="370" y="185"><b>Punto de fusión:</b> Temperatura máxima</text>
      <text x="390" y="202">Acero: 1.500°C | Al: 660°C | Plástico: 80-300°C</text>

      <text x="370" y="230"><b>Dilatación térmica:</b> Cambia de tamaño con T°</text>
      <text x="390" y="247">Plástico ↑↑ | Aluminio | Acero ↓ | Vidrio ↓↓</text>

      <text x="370" y="275"><b>Aislamiento:</b> No deja pasar calor</text>
      <text x="390" y="292">Corcho > Lana > Plástico > Metal</text>
    </g>
  </g>

  <!-- ELECTRICAL PROPERTIES -->
  <g>
    <rect x="670" y="80" width="300" height="240" class="neutral" rx="5"/>
    <text x="820" y="105" class="label" font-size="13" font-weight="bold">Propiedades Eléctricas</text>

    <g font-family="Arial" font-size="11" fill="#2c3e50" text-anchor="start">
      <text x="690" y="140"><b>Conductividad:</b> Deja pasar corriente</text>
      <text x="710" y="157">Plata > Cobre > Aluminio > Hierro</text>

      <text x="690" y="185"><b>Semiconductores:</b> Conduce "a medias"</text>
      <text x="710" y="202">Silicio, Germanio → Transistores, células solares</text>

      <text x="690" y="230"><b>Aislantes:</b> No conducen</text>
      <text x="710" y="247">Plástico, Cerámica, Vidrio, Madera</text>

      <text x="690" y="275"><b>Permitividad:</b> Capacidad de almacenar carga</text>
      <text x="710" y="292">Cerámica >> Vacío > Plástico</text>
    </g>
  </g>

  <!-- OTHER PROPERTIES -->
  <g>
    <rect x="30" y="340" width="940" height="170" class="neutral" rx="5"/>
    <text x="50" y="365" class="label" font-size="13" font-weight="bold" text-anchor="start">Otras Propiedades Importantes</text>

    <g font-family="Arial" font-size="11" fill="#2c3e50" text-anchor="start">
      <text x="50" y="395"><b>Densidad:</b> Peso por volumen. Aluminio es ligero (2,7 g/cm³), Acero pesado (7,85 g/cm³), Titanio ultraligero (4,5 g/cm³)</text>

      <text x="50" y="420"><b>Corrosión (Oxidación):</b> Hierro → Óxido (se oxida). Aluminio → Óxido protector (se detiene). Acero inoxidable → No se oxida. Plástico → No se oxida.</text>

      <text x="50" y="445"><b>Trabajabilidad:</b> Facilidad para trabajar. Aluminio y cobre → Muy fácil. Acero → Difícil. Vidrio → Muy difícil.</text>

      <text x="50" y="470"><b>Precio:</b> Plástico &lt; Aluminio &lt; Hierro &lt; Acero especial &lt; Titanio. Siempre hay equilibrio entre prestaciones y coste.</text>

      <text x="50" y="495"><b>Sostenibilidad:</b> ¿Se recicla? Acero y Aluminio: Excelente. Plástico: Malo (tarda 450 años). Madera: Renovable. Vidrio: 100% reciclable.</text>
    </g>
  </g>

  <!-- DECISION TABLE -->
  <g>
    <text x="50" y="555" class="label" font-size="13" text-anchor="start" font-weight="bold">¿Qué material elegir?</text>

    <rect x="50" y="575" width="900" height="110" fill="#fffbea" stroke="#f39c12" stroke-width="2" rx="3"/>

    <g font-family="Arial" font-size="10.5" fill="#2c3e50" text-anchor="start">
      <text x="70" y="600"><b>Necesitas resistencia y bajo peso:</b> Aluminio o Titanio (aviones, bicicletas)</text>
      <text x="70" y="622"><b>Necesitas resistencia máxima:</b> Acero (vigas, estructuras, herramientas)</text>
      <text x="70" y="644"><b>Necesitas economía:</b> Hierro/Acero (barato pero pesado) o Plástico (muy barato pero débil)</text>
      <text x="70" y="666"><b>Necesitas transparencia:</b> Vidrio (frágil, no trabajable) o Plástico (trabajable, durable)</text>
    </g>
  </g>

</svg>