<svg viewBox="0 0 1000 700" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font-family: Arial, sans-serif; font-size: 16px; font-weight: bold; text-anchor: middle; }
      .label { font-family: Arial, sans-serif; font-size: 12px; }
      .code { font-family: 'Courier New', monospace; font-size: 10px; }
      .flowbox { stroke: #2c3e50; stroke-width: 2; }
    </style>
    <marker id="arrowblue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#3498db"/>
    </marker>
    <marker id="arrowgreen" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#27ae60"/>
    </marker>
    <marker id="arrowred" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#e74c3c"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1000" height="700" fill="#f8f9fa"/>

  <!-- Title -->
  <text x="500" y="35" class="title" font-size="18">Condicionales: si esto, haz eso</text>
  <text x="500" y="55" class="label" font-size="11" fill="#666" text-anchor="middle">C&oacute;mo los programas toman decisiones: IF, ELSE, y el flujo del programa</text>

  <!-- FLOWCHART: Basic IF structure -->
  <g>
    <text x="500" y="95" class="title" font-size="13" text-anchor="middle">Estructura: SI (condición) ENTONCES (acción)</text>

    <!-- Start -->
    <circle cx="500" cy="140" r="20" fill="#e8f4f8" stroke="#3498db" stroke-width="2"/>
    <text x="500" y="148" class="label" font-size="11" text-anchor="middle" font-weight="bold">INICIO</text>

    <!-- Arrow down -->
    <path d="M 500 160 L 500 190" stroke="#3498db" stroke-width="2" fill="none" marker-end="url(#arrowblue)"/>

    <!-- Decision diamond: temperatura < 20? -->
    <g>
      <path d="M 500 190 L 580 230 L 500 270 L 420 230 Z" fill="#fff8e8" stroke="#f39c12" stroke-width="2"/>
      <text x="500" y="225" class="label" font-size="9" text-anchor="middle" font-weight="bold">¿Temperatura</text>
      <text x="500" y="240" class="label" font-size="9" text-anchor="middle" font-weight="bold">&lt; 20 °C?</text>
    </g>

    <!-- YES path (left) -->
    <path d="M 420 230 L 320 230" stroke="#27ae60" stroke-width="2.5" fill="none" marker-end="url(#arrowgreen)"/>
    <text x="360" y="220" class="label" font-size="10" fill="#27ae60" font-weight="bold">SÍ (verdadero)</text>

    <!-- Action box (left) -->
    <rect x="200" y="200" width="120" height="60" fill="#f0fef0" stroke="#27ae60" stroke-width="2" rx="3"/>
    <text x="260" y="220" class="label" font-size="10" text-anchor="middle" font-weight="bold">ENCENDER</text>
    <text x="260" y="235" class="label" font-size="10" text-anchor="middle" font-weight="bold">CALEFACCIÓN</text>

    <!-- Arrow to end (from left action) -->
    <path d="M 260 260 L 260 320 L 500 320 L 500 310" stroke="#2c3e50" stroke-width="1.5" fill="none" marker-end="url(#arrowblue)"/>

    <!-- NO path (right) -->
    <path d="M 580 230 L 680 230" stroke="#e74c3c" stroke-width="2.5" fill="none" marker-end="url(#arrowred)"/>
    <text x="640" y="220" class="label" font-size="10" fill="#e74c3c" font-weight="bold">NO (falso)</text>

    <!-- Action box (right) -->
    <rect x="680" y="200" width="120" height="60" fill="#fef8e8" stroke="#f39c12" stroke-width="2" rx="3"/>
    <text x="740" y="220" class="label" font-size="10" text-anchor="middle" font-weight="bold">APAGAR</text>
    <text x="740" y="235" class="label" font-size="10" text-anchor="middle" font-weight="bold">CALEFACCIÓN</text>

    <!-- Arrow to end (from right action) -->
    <path d="M 740 260 L 740 320 L 500 320" stroke="#2c3e50" stroke-width="1.5" fill="none" marker-end="url(#arrowblue)"/>

    <!-- End -->
    <circle cx="500" cy="340" r="20" fill="#e8f4f8" stroke="#3498db" stroke-width="2"/>
    <text x="500" y="348" class="label" font-size="11" text-anchor="middle" font-weight="bold">FIN</text>
  </g>

  <!-- BOTTOM: Code examples and explanation -->
  <g>
    <rect x="30" y="410" width="940" height="270" fill="white" stroke="#2c3e50" stroke-width="1.5" rx="3"/>

    <text x="500" y="440" class="title" font-size="13">C&oacute;digo equivalente (pseudoc&oacute;digo y lenguajes reales)</text>

    <!-- Left: Pseudocode -->
    <g>
      <text x="60" y="470" class="label" font-size="11" font-weight="bold">Pseudoc&oacute;digo (lógica sin lenguaje)</text>
      <rect x="40" y="480" width="420" height="150" fill="#f9f9f9" stroke="#ccc" stroke-width="1" rx="2"/>
      <text x="60" y="505" class="code" fill="#e74c3c">SI</text>
      <text x="90" y="505" class="code" fill="#2c3e50">temperatura &lt; 20</text>
      <text x="60" y="525" class="code" fill="#2c3e50">    encender_calefaccion()</text>
      <text x="60" y="545" class="code" fill="#e74c3c">SINO</text>
      <text x="60" y="565" class="code" fill="#2c3e50">    apagar_calefaccion()</text>
      <text x="60" y="585" class="code" fill="#e74c3c">FIN</text>
    </g>

    <!-- Right: Python code -->
    <g>
      <text x="540" y="470" class="label" font-size="11" font-weight="bold">Python (código real)</text>
      <rect x="520" y="480" width="420" height="150" fill="#f9f9f9" stroke="#ccc" stroke-width="1" rx="2"/>
      <text x="540" y="505" class="code" fill="#3498db">if</text>
      <text x="570" y="505" class="code" fill="#2c3e50">temperatura &lt; 20:</text>
      <text x="540" y="525" class="code" fill="#2c3e50">    encender_calefaccion()</text>
      <text x="540" y="545" class="code" fill="#3498db">else</text>
      <text x="570" y="545" class="code">:</text>
      <text x="540" y="565" class="code" fill="#2c3e50">    apagar_calefaccion()</text>
    </g>

    <!-- Key points -->
    <g font-family="Arial" font-size="10" fill="#2c3e50" text-anchor="start">
      <text x="60" y="660"><b>Lo importante:</b></text>
      <text x="80" y="678">• La <b>condición</b> es una pregunta que da SÍ o NO (true/false)</text>
      <text x="80" y="696">• La indentación (espacios) marca qué código va dentro del IF/ELSE</text>
    </g>
  </g>

</svg>