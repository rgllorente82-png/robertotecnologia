<svg viewBox="-92.7 -31.8 1124.5 664.2" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .box { stroke: #2c3e50; stroke-width: 2; fill-opacity: 0.9; }
      .title { font-family: Arial, sans-serif; font-size: 14px; font-weight: bold; text-anchor: middle; }
      .label { font-family: Arial, sans-serif; font-size: 12px; text-anchor: middle; }
      .vs { font-family: Arial, sans-serif; font-size: 16px; font-weight: bold; text-anchor: middle; }
    </style>
  </defs>

  <!-- Background -->
  <rect x="-45" y="-15" width="1060" height="631" fill="#f8f9fa"/>

  <!-- Title -->
  <text x="500" y="35" class="title" font-size="18">Métodos de Fabricación: Aditiva vs Sustractiva</text>

  <!-- Left: SUBTRACTIVE -->
  <g>
    <text x="250" y="80" class="title" font-size="14" font-weight="bold">SUSTRACTIVA (Subtractive)</text>
    <text x="250" y="100" class="label" font-size="11">Quitar material</text>

    <!-- Material block -->
    <rect x="100" y="130" width="300" height="150" class="box" fill="#e8f4f8" stroke-width="3"/>
    <text x="250" y="155" class="label" font-weight="bold" font-size="13">Material bruto</text>
    <text x="250" y="175" class="label" font-size="10">(bloque de metal,</text>
    <text x="250" y="190" class="label" font-size="10">madera, plástico)</text>
    <text x="250" y="215" class="label" font-size="13" fill="#e74c3c" font-weight="bold">↓ RESTA MATERIAL ↓</text>

    <!-- Waste material -->
    <g>
      <rect x="120" y="310" width="30" height="30" fill="#ecf0f1" stroke="#666" stroke-width="1"/>
      <rect x="160" y="315" width="25" height="25" fill="#ecf0f1" stroke="#666" stroke-width="1"/>
      <rect x="195" y="320" width="35" height="20" fill="#ecf0f1" stroke="#666" stroke-width="1"/>
      <text x="250" y="360" class="label" font-size="10" font-weight="bold">RESIDUOS: 30-80%</text>
      <text x="250" y="375" class="label" font-size="9">del material se desperdicia</text>
    </g>

    <!-- Final product -->
    <g>
      <path d="M220,410 L280,410 L290,450 L210,450 Z" fill="#27ae60" stroke="#2c3e50" stroke-width="2"/>
      <text x="250" y="440" class="label" fill="white" font-weight="bold">PRODUCTO</text>
    </g>

    <!-- Examples -->
    <rect x="50" y="480" width="400" height="100" fill="#e8f4f8" stroke="#3498db" stroke-width="1" rx="3"/>
    <text x="70" y="500" class="label" font-size="11" text-anchor="start" font-weight="bold">Técnicas sustractivas:</text>
    <text x="70" y="520" class="label" font-size="10" text-anchor="start">• <tspan font-weight="bold">Torneado:</tspan> Piezas redondas (ejes, cilindros)</text>
    <text x="70" y="535" class="label" font-size="10" text-anchor="start">• <tspan font-weight="bold">Fresado CNC:</tspan> Piezas complejas en XYZ</text>
    <text x="70" y="550" class="label" font-size="10" text-anchor="start">• <tspan font-weight="bold">Cortadora láser:</tspan> Cortes precisos en chapas</text>
    <text x="70" y="565" class="label" font-size="10" text-anchor="start">• <tspan font-weight="bold">Tallado manual:</tspan> Lento pero preciso (madera, piedra)</text>
  </g>

  <!-- VS in center -->
  <text x="500" y="260" class="vs">VS</text>
  <rect x="470" y="240" width="60" height="40" fill="#ecf0f1" stroke="#2c3e50" stroke-width="2" rx="20"/>

  <!-- Right: ADDITIVE -->
  <g>
    <text x="750" y="80" class="title" font-size="14" font-weight="bold">ADITIVA (Additive)</text>
    <text x="750" y="100" class="label" font-size="11">Añadir material</text>

    <!-- Empty space -->
    <rect x="600" y="130" width="300" height="150" class="box" fill="#ecf0f1" stroke-width="3" stroke-dasharray="5,5"/>
    <text x="750" y="180" class="label" font-weight="bold" font-size="13">Nada (vacío)</text>
    <text x="750" y="215" class="label" font-size="13" fill="#27ae60" font-weight="bold">↓ SUMA MATERIAL ↓</text>

    <!-- Material being added -->
    <g>
      <circle cx="700" cy="280" r="15" fill="#3498db" stroke="#2c3e50" stroke-width="1"/>
      <circle cx="760" cy="290" r="12" fill="#3498db" stroke="#2c3e50" stroke-width="1"/>
      <circle cx="800" cy="295" r="18" fill="#3498db" stroke="#2c3e50" stroke-width="1"/>
      <text x="750" y="340" class="label" font-size="10" font-weight="bold">Residuos: 0-5%</text>
      <text x="750" y="355" class="label" font-size="9">(mínima pérdida)</text>
    </g>

    <!-- Final product -->
    <g>
      <path d="M720,410 L780,410 L790,450 L710,450 Z" fill="#e74c3c" stroke="#2c3e50" stroke-width="2"/>
      <text x="750" y="440" class="label" fill="white" font-weight="bold">PRODUCTO</text>
    </g>

    <!-- Examples -->
    <rect x="550" y="480" width="400" height="100" fill="#e8f4f8" stroke="#3498db" stroke-width="1" rx="3"/>
    <text x="570" y="500" class="label" font-size="11" text-anchor="start" font-weight="bold">Técnicas aditivas:</text>
    <text x="570" y="520" class="label" font-size="10" text-anchor="start">• <tspan font-weight="bold">Impresión 3D FDM:</tspan> Plástico capa por capa</text>
    <text x="570" y="535" class="label" font-size="10" text-anchor="start">• <tspan font-weight="bold">Impresión 3D SLA:</tspan> Resina con láser</text>
    <text x="570" y="550" class="label" font-size="10" text-anchor="start">• <tspan font-weight="bold">Sinterizado:</tspan> Polvo fusionado (metal)</text>
    <text x="570" y="565" class="label" font-size="10" text-anchor="start">• <tspan font-weight="bold">Soldadura/Pegado:</tspan> Unir piezas pequeñas</text>
  </g>

  <!-- Bottom comparison -->
  <rect x="30" y="600" width="940" height="0" fill="white"/>
</svg>